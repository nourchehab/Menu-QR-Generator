<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Menu Preview — FlavorFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream:    #f9f5ef;
            --warm:     #f2ebe0;
            --ink:      #1a1208;
            --muted:    #7a6e60;
            --accent:   #c8622a;
            --accent2:  #e8a45a;
            --divider:  #ddd5c4;
            --card-bg:  #ffffff;
            --shadow:   0 2px 20px rgba(26,18,8,0.08);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--menu-bg, var(--cream));
            color: var(--menu-text, var(--ink));
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
        }

        /* ===== PREVIEW BANNER ===== */
        .preview-banner {
            background: var(--ink);
            color: var(--cream);
            text-align: center;
            padding: 10px 20px;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .preview-banner .dot {
            width: 8px; height: 8px;
            background: var(--accent2);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .banner-actions {
            position: absolute;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-banner {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-banner:hover { background: #a84e20; }
        .btn-banner.outline {
            background: transparent;
            border: 1px solid rgba(249,245,239,0.4);
            color: var(--cream);
        }
        .btn-banner.outline:hover { background: rgba(249,245,239,0.1); }

        /* ===== HEADER ===== */
        .restaurant-header {
            background: var(--menu-bg, var(--warm));
            border-bottom: 1px solid var(--divider);
            padding: 48px 24px 36px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .restaurant-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 110%, rgba(200,98,42,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .logo-wrap {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 3px solid var(--divider);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .logo-placeholder {
            font-size: 2rem;
            color: var(--muted);
        }
        .restaurant-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .restaurant-type {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* ===== MAIN LAYOUT ===== */
        .menu-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* ===== SECTION HEADING ===== */
        .section-label {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }
        .section-label h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider);
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* ===== MENU CARD ===== */
        .menu-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--divider);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: fadeUp 0.5s ease both;

            /* ✅ IMPORTANT: card text should NOT inherit theme text */
            color: var(--ink);
        }
        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(26,18,8,0.13);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .menu-card:nth-child(2) { animation-delay: 0.07s; }
        .menu-card:nth-child(3) { animation-delay: 0.14s; }
        .menu-card:nth-child(4) { animation-delay: 0.21s; }
        .menu-card:nth-child(5) { animation-delay: 0.28s; }
        .menu-card:nth-child(6) { animation-delay: 0.35s; }

        .card-photo {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: var(--warm);
        }

        .card-body {
            padding: 18px 20px 20px;
            /* keep card body text stable */
            color: var(--ink);
        }

        /* ✅ Force title to dark ink so it stays readable on white cards */
        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
            color: var(--ink);
        }

        /* ✅ Force description to muted gray (not theme text) */
        .card-desc {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--divider);
            padding-top: 14px;
        }
        .card-price {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }
        .card-badge {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--warm);
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 400;
            font-style: italic;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .empty-state p { font-size: 0.9rem; }

        /* ===== LOADING ===== */
        .loading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .skeleton {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--divider);
        }
        .skeleton-img {
            width: 100%; height: 190px;
            background: linear-gradient(90deg, var(--warm) 25%, var(--divider) 50%, var(--warm) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-body { padding: 18px 20px; }
        .skeleton-line {
            height: 14px; border-radius: 4px; margin-bottom: 10px;
            background: linear-gradient(90deg, var(--warm) 25%, var(--divider) 50%, var(--warm) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-line.short { width: 55%; }
        .skeleton-line.price { width: 30%; margin-top: 16px; height: 18px; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== ERROR STATE ===== */
        .error-state {
            background: #fff5f5;
            border: 1px solid #fcc;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            color: #c0392b;
        }
        .error-state h3 { margin-bottom: 6px; font-size: 1rem; }
        .error-state p { font-size: 0.85rem; opacity: 0.8; }
        .btn-retry {
            margin-top: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
        }

        /* ===== ITEM COUNT ===== */
        .item-count {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 24px;
            letter-spacing: 0.04em;
        }

        /* ===== FOOTER ===== */
        .menu-footer {
            text-align: center;
            padding: 32px 20px;
            border-top: 1px solid var(--divider);
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.05em;
        }
        .menu-footer span { color: var(--accent); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .restaurant-header { padding: 36px 16px 28px; }
            .menu-container { padding: 28px 14px 60px; }
            .menu-grid, .loading-grid { grid-template-columns: 1fr; }
            .banner-actions { display: none; }
            .preview-banner { font-size: 0.7rem; }
        }
    </style>
</head>
<body th:attr="data-public=${publicMode}, data-restaurant-id=${restaurantId}">

<div class="preview-banner">
    <div class="dot"></div>
    Preview Mode — This is how customers will see your menu
    <div class="banner-actions">
        <a href="/dashboard" class="btn-banner outline">← Back to Dashboard</a>
        <a href="/qr-page" target="_blank" class="btn-banner">Generate QR Code</a>
    </div>
</div>

<header class="restaurant-header">
    <div class="logo-wrap" id="logoWrap">
        <div class="logo-placeholder">🍽</div>
    </div>
    <h1 class="restaurant-name" id="restaurantName">Loading…</h1>
    <span class="restaurant-type" id="restaurantType"></span>
</header>

<main class="menu-container">
    <div class="section-label">
        <h2>Our Menu</h2>
    </div>
    <p class="item-count" id="itemCount"></p>
    <div id="menuContent">
        <div class="loading-grid" id="loadingGrid">
            <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line price"></div></div></div>
            <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line price"></div></div></div>
            <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line price"></div></div></div>
        </div>
        <div class="menu-grid" id="menuGrid" style="display:none;"></div>
    </div>
</main>

<footer class="menu-footer">
    Powered by <span>FlavorFrame</span>
</footer>

<script>
    const typeEmojis = {
        cafe: '☕', buffet: '🍱', fastfood: '🍔',
        finedining: '🍷', default: '🍽'
    };

    const typeLabels = {
        cafe: 'Café', buffet: 'Buffet', fastfood: 'Fast Food',
        finedining: 'Fine Dining', default: 'Restaurant'
    };

    function getItemName(item) {
        return item?.itemName ?? item?.name ?? '';
    }

    function getItemDescription(item) {
        return item?.itemDescription ?? item?.description ?? '';
    }

    function getItemPrice(item) {
        const v = item?.itemPrice ?? item?.price ?? 0;
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
    }

    function getItemPhotoUrl(item) {
        if (item?.photoUrl) return item.photoUrl;
        if (item?.photoPath) return `/uploads/photos/${item.photoPath}`;
        if (item?.imageUrl) return item.imageUrl;
        return '/images/menu-item-placeholder.svg';
    }

    async function loadMenuPreview() {
        try {
            const isPublic = String(document.body.dataset.public).toLowerCase() === 'true';
            const restaurantId = document.body.dataset.restaurantId;

            const restaurantUrl = isPublic
                ? `/api/public/restaurants/${encodeURIComponent(restaurantId)}`
                : '/api/restaurant/me';

            const resRes = await fetch(restaurantUrl);
            if (!resRes.ok) throw new Error('Could not load restaurant info');
            const restaurant = await resRes.json();

            // Apply menu theme ONLY to page background + general text.
            if (restaurant.menuBackgroundColor) {
                document.documentElement.style.setProperty('--menu-bg', restaurant.menuBackgroundColor);
            }
            if (restaurant.menuTextColor) {
                document.documentElement.style.setProperty('--menu-text', restaurant.menuTextColor);
            }

            document.getElementById('restaurantName').textContent = restaurant.restaurantName || 'My Restaurant';
            const type = (restaurant.restaurantType || 'default').toLowerCase();
            document.getElementById('restaurantType').textContent = typeLabels[type] || typeLabels.default;

            if (restaurant.logoPath) {
                document.getElementById('logoWrap').innerHTML =
                    `<img src="/uploads/logos/${restaurant.logoPath}" alt="${escHtml(restaurant.restaurantName)} logo" />`;
            } else {
                document.getElementById('logoWrap').innerHTML =
                    `<div class="logo-placeholder">${typeEmojis[type] || typeEmojis.default}</div>`;
            }

            const itemsUrl = isPublic
                ? `/api/public/restaurants/${encodeURIComponent(restaurantId)}/items`
                : '/api/items';

            const itemRes = await fetch(itemsUrl);
            if (!itemRes.ok) throw new Error('Could not load menu items');
            const items = await itemRes.json();

            document.getElementById('loadingGrid').style.display = 'none';
            document.getElementById('menuGrid').style.display = 'grid';

            if (!items || items.length === 0) {
                document.getElementById('itemCount').textContent = '';
                document.getElementById('menuGrid').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <div class="icon">🍽</div>
                        <h3>No items yet</h3>
                        <p>Add menu items from your dashboard to see them here.</p>
                    </div>`;
                return;
            }

            const count = items.length;
            document.getElementById('itemCount').textContent =
                `${count} item${count !== 1 ? 's' : ''} on the menu`;

            document.getElementById('menuGrid').innerHTML = items.map((item, i) => {
                const name = getItemName(item);
                const desc = getItemDescription(item);
                const price = getItemPrice(item).toFixed(2);
                const photoSrc = getItemPhotoUrl(item);

                const photo = `<img class="card-photo" src="${photoSrc}" alt="${escHtml(name)}" loading="lazy" onerror="this.src='/images/menu-item-placeholder.svg';" />`;

                return `
                <div class="menu-card" style="animation-delay:${i * 0.07}s">
                    ${photo}
                    <div class="card-body">
                        <div class="card-name">${escHtml(name)}</div>
                        <div class="card-desc">${escHtml(desc)}</div>
                        <div class="card-footer">
                            <span class="card-price">$${price}</span>
                            <span class="card-badge">Available</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

        } catch (err) {
            document.getElementById('loadingGrid').style.display = 'none';
            document.getElementById('menuGrid').style.display = 'grid';
            document.getElementById('menuGrid').innerHTML = `
                <div class="error-state" style="grid-column:1/-1">
                    <h3>Couldn't load menu</h3>
                    <p>${escHtml(err.message)}</p>
                    <button class="btn-retry" onclick="location.reload()">Try Again</button>
                </div>`;
        }
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    loadMenuPreview();
</script>
</body>
</html>
