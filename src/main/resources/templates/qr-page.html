<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="ngrok-skip-browser-warning" content="true"/>
    <title>Your Menu QR Code — FlavorFrame</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root { --bg:#050505; --surface:#0d0d0d; --surface2:#121212; --text:#f7efe8; --muted:#b8a79d; --line:rgba(255,255,255,0.08); --orange:#ff7a1a; --orange2:#ff9a4d; }
        body { background:radial-gradient(circle at top right, rgba(255,122,26,.10), transparent 20%), radial-gradient(circle at bottom left, rgba(255,122,26,.06), transparent 18%), var(--bg); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; color:var(--text); }
        .card { background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 100%), var(--surface); border:1px solid var(--line); border-radius:28px; padding:48px 40px; text-align:center; max-width:460px; width:100%; box-shadow:0 22px 50px rgba(0,0,0,.36); }
        h1 { font-family:'Sora',sans-serif; font-size:2.1rem; font-weight:700; letter-spacing:-.04em; margin-bottom:10px; } .subtitle{color:var(--muted); font-size:.92rem; margin-bottom:24px; line-height:1.7;} .qr-loading{color:var(--muted); font-size:.88rem; padding:20px;} .qr-wrap{background:var(--surface2); border:1px solid var(--line); border-radius:18px; padding:16px; display:inline-block; margin-bottom:20px; box-shadow:0 8px 22px rgba(0,0,0,.16);} #qrImage{display:block; width:280px; height:280px;} .menu-link{display:block; font-size:.8rem; color:var(--muted); margin-bottom:24px; word-break:break-all; background:var(--surface2); padding:10px 12px; border-radius:12px; border:1px solid var(--line); text-decoration:none;} .menu-link:hover{color:var(--text);} .fallback-note{font-size:.8rem; color:var(--muted); margin-bottom:24px;} .actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:20px;} .btn{padding:12px 22px; border-radius:999px; font-family:'Inter',sans-serif; font-size:.9rem; font-weight:700; cursor:pointer; border:none; text-decoration:none; transition:all .25s ease; display:inline-flex; align-items:center; gap:6px;} .btn-primary{background:linear-gradient(135deg, var(--orange2), var(--orange)); color:#fff; box-shadow:0 0 0 1px rgba(255,122,26,.18),0 0 24px rgba(255,122,26,.22),0 10px 24px rgba(255,122,26,.18);} .btn-outline{background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); color:var(--muted);} .btn-outline:hover{background:rgba(255,255,255,.05); color:var(--text);} .back-link{font-size:.84rem; color:var(--muted); text-decoration:none;} .back-link:hover{color:var(--text);} .error-msg{color:#ff8c7e; font-size:.85rem; margin-top:16px; display:none;} @media(max-width:480px){ .card{padding:32px 20px;} #qrImage{width:240px;height:240px;} }

    </style>
</head>
<body>
<div class="card">
    <h1>Menu QR Code</h1>
    <p class="subtitle" id="subtitle">Customers scan this to instantly view your digital menu — no app needed.</p>

    <div class="qr-wrap">
        <img id="qrImage" src="" alt="Menu QR Code" style="display:none;" onerror="handleQrError()"/>
        <div class="qr-loading" id="qrLoading">Generating QR code…</div>
    </div>
    <br/>

    <p class="fallback-note">
        Can't scan? Share this link:<br/>
        <a id="menuLink" class="menu-link" href="#" target="_blank">Loading…</a>
    </p>

    <div class="actions">
        <button class="btn btn-primary" onclick="downloadQr()">⬇ Download QR</button>
        <a id="previewBtn" class="btn btn-outline" href="#" target="_blank">👁 Preview Menu</a>
    </div>

    <a id="backBtn" class="back-link" href="/restaurants">← Back to Dashboard</a>

</div>

<script>
    const params   = new URLSearchParams(window.location.search);
    const branchId = params.get('branchId');

    let qrApiUrl    = '';
    let menuUrl     = '';
    let restaurantId = null;

    const fetchOpts = { headers: { 'ngrok-skip-browser-warning': 'true' } };

    async function init() {
        try {
            // If opened from a branch dashboard, prefer branch-level QR and fallbacks
            if (branchId) {
                try {
                    const res = await fetch(`/api/restaurant/branch/${branchId}`, fetchOpts);
                    if (res.ok) {
                        const data = await res.json();
                        restaurantId = data.id;
                        if (data.restaurantName) {
                            const sub = document.getElementById('subtitle');
                            if (sub) sub.textContent = `Customers scan this to view ${data.restaurantName}'s menu.`;
                        }
                    }
                } catch (ignored) {
                    // ignore branch info failures — we'll still show a branch-level QR
                }

                const back = document.getElementById('backBtn');
                if (back) back.href = `/branch/${branchId}/dashboard`;
                const prev = document.getElementById('previewBtn');
                if (prev) prev.href = `/menu/preview?branchId=${branchId}`;

                // Prefer the branch-level QR endpoint (public) and branch URL as the menu link
                qrApiUrl = `/api/qr/branch/${branchId}`;
                menuUrl  = `${location.origin}/b/${branchId}`;

            } else {
                // No branchId — attempt to resolve the current user's restaurant (requires auth)
                const res = await fetch('/api/restaurant/me', fetchOpts);
                if (!res.ok) throw new Error('Restaurant not found');
                const data = await res.json();
                restaurantId = data.id;

                const prev = document.getElementById('previewBtn');
                if (prev) prev.href = '/menu/preview';
                const back = document.getElementById('backBtn');
                if (back) back.href = '/restaurants';

                qrApiUrl = `/api/qr/restaurant/${restaurantId}`;
                menuUrl  = `${location.origin}/r/${restaurantId}`;
            }

            if (!qrApiUrl) throw new Error('Could not determine QR endpoint');

            const qrImg = document.getElementById('qrImage');
            if (qrImg) {
                qrImg.onload = () => {
                    const loading = document.getElementById('qrLoading');
                    if (loading) loading.style.display = 'none';
                    qrImg.style.display = 'block';
                };
                qrImg.src = qrApiUrl;
            }

            const linkEl = document.getElementById('menuLink');
            if (linkEl) {
                linkEl.href = menuUrl;
                linkEl.textContent = menuUrl;
            }

        } catch (e) {
            const loading = document.getElementById('qrLoading');
            if (loading) loading.textContent = 'Could not load QR code.';
            const linkEl = document.getElementById('menuLink');
            if (linkEl) linkEl.textContent = 'Could not load link';
            const err = document.getElementById('errorMsg');
            if (err) err.style.display = 'block';
        }
    }

    async function downloadQr() {
        if (!qrApiUrl) { alert('QR not loaded yet.'); return; }
        try {
            const res = await fetch(qrApiUrl, fetchOpts);
            if (!res.ok) throw new Error('Failed');
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = restaurantId ? `menu-qr-${restaurantId}.png` : 'menu-qr.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch { alert('Download failed. Please try again.'); }
    }

    function handleQrError() {
        document.getElementById('qrLoading').style.display  = 'none';
        document.getElementById('qrImage').style.display    = 'none';
        document.getElementById('errorMsg').style.display   = 'block';
    }

    init();
</script>
</body>
</html>
