<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/effects.css">
    <title>Verify Email – FlavorFrame</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        .verification-container {
            text-align: center;
        }

        .verification-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .email-display {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
            margin: 12px 0;
            font-family: monospace;
            font-size: 14px;
        }

        .code-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 24px 0;
        }

        .code-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            border-color: #ff6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .code-input.error {
            border-color: #e74c3c;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .resend-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #eee;
        }

        .resend-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .countdown {
            font-weight: bold;
            color: #ff6b6b;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .error-message {
            background: #fdecea;
            color: #e74c3c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="verification-container">
            <div class="verification-icon">📧</div>
            <h2>Verify Your Email</h2>
            <p>We've sent a verification code to</p>
            <div class="email-display" th:text="${userEmail}"></div>

            <div class="success-message" th:if="${resent}">
                A new verification code has been sent to your email.
            </div>

            <div class="error-message" th:if="${error}">
                <span th:if="${error == 'invalid'}">
                    Invalid or expired code. Please try again.
                </span>
                <span th:if="${error == 'attempts'}">
                    Too many attempts. Please request a new code.
                </span>
            </div>

            <form id="verifyForm" method="post" action="/signup/verify" class="auth-form">
                <div class="code-inputs">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
                </div>
                
                <input type="hidden" name="code" id="codeField">

                <button type="submit" class="btn btn-primary" id="verifyBtn" disabled>
                    Verify & Create Account
                </button>

                <div class="resend-section">
                    <p class="resend-text">
                        Didn't receive the code? 
                        <span id="resendTimer">
                            Wait <span class="countdown" id="countdown">60</span>s
                        </span>
                    </p>
                    <form id="resendForm" method="post" action="/signup/verify/resend" style="display: none;">
                        <button type="submit" class="btn btn-secondary">
                            Resend Code
                        </button>
                    </form>
                </div>

                <span class="auth-footer">
                    <a href="/signup">← Back to Sign Up</a>
                </span>
            </form>
        </div>
    </div>
</div>

<script>
    const codeInputs = document.querySelectorAll('.code-input');
    const codeField = document.getElementById('codeField');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyForm = document.getElementById('verifyForm');
    const resendTimer = document.getElementById('resendTimer');
    const resendForm = document.getElementById('resendForm');
    const countdownSpan = document.getElementById('countdown');

    // Handle code input
    codeInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            const value = e.target.value;
            
            // Only allow numbers
            if (!/^\d*$/.test(value)) {
                e.target.value = '';
                return;
            }

            // Move to next input
            if (value && index < codeInputs.length - 1) {
                codeInputs[index + 1].focus();
            }

            // Check if all inputs are filled
            updateVerifyButton();
        });

        input.addEventListener('keydown', (e) => {
            // Handle backspace
            if (e.key === 'Backspace' && !input.value && index > 0) {
                codeInputs[index - 1].focus();
            }

            // Handle paste
            if (e.key === 'v' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                navigator.clipboard.readText().then(text => {
                    const digits = text.replace(/\D/g, '').slice(0, 6);
                    digits.split('').forEach((digit, i) => {
                        if (codeInputs[i]) {
                            codeInputs[i].value = digit;
                        }
                    });
                    updateVerifyButton();
                    if (digits.length === 6) {
                        codeInputs[5].focus();
                    }
                });
            }
        });
    });

    function updateVerifyButton() {
        const code = Array.from(codeInputs).map(input => input.value).join('');
        codeField.value = code;
        verifyBtn.disabled = code.length !== 6;
    }

    // Prevent multiple submissions
    let isSubmitting = false;
    
    verifyForm.addEventListener('submit', (e) => {
        if (isSubmitting) {
            e.preventDefault();
            return;
        }
        
        isSubmitting = true;
        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';
        
        console.log('Submitting code:', codeField.value);
    });

    // Countdown timer for resend
    let countdown = 60;
    const timer = setInterval(() => {
        countdown--;
        countdownSpan.textContent = countdown;
        
        if (countdown <= 0) {
            clearInterval(timer);
            resendTimer.style.display = 'none';
            resendForm.style.display = 'block';
        }
    }, 1000);

    // Focus first input on page load
    codeInputs[0].focus();

    // Add error class if there's an error
    const hasError = /*[[${error}]]*/ false;
    if (hasError) {
        codeInputs.forEach(input => {
            input.classList.add('error');
            setTimeout(() => input.classList.remove('error'), 300);
        });
    }
</script>
</body>
</html>
