<!DOCTYPE html>
<html>
<head>
    <title>Enter Items – FlavorFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:linear-gradient(135deg,#ff6b35 0%,#f7931e 50%,#ff8c42 100%); min-height:100vh; padding:2rem; position:relative; overflow-x:hidden; }
        body::before { content:''; position:absolute; top:-50%; right:-50%; width:100%; height:100%; background:radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px); background-size:50px 50px; animation:drift 60s linear infinite; pointer-events:none; }
        @keyframes drift { 0%{transform:translate(0,0);} 100%{transform:translate(50px,50px);} }
        .container { max-width:800px; margin:0 auto; position:relative; }
        .header { display:flex; align-items:center; gap:1.5rem; margin-bottom:2.5rem; }
        .back-btn { background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.3); border-radius:12px; padding:0.75rem 1rem; color:white; font-family:'DM Sans',sans-serif; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.3s ease; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; backdrop-filter:blur(10px); }
        .back-btn:hover { background:rgba(255,255,255,0.25); transform:translateX(-3px); }
        .header-text {}
        .page-title { font-family:'Fraunces',serif; font-size:2.25rem; font-weight:300; color:white; letter-spacing:-0.02em; }
        .branch-label { font-size:0.85rem; color:rgba(255,255,255,0.75); margin-top:0.2rem; font-weight:500; }
        .form-card { background:rgba(255,255,255,0.98); border-radius:24px; padding:3rem; box-shadow:0 30px 90px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.1); }
        .form-group { margin-bottom:2rem; }
        .form-group label { display:block; font-weight:600; color:#1a1a2e; margin-bottom:0.75rem; font-size:0.95rem; }
        .form-group .optional { font-weight:400; color:#666; font-size:0.85rem; margin-left:0.5rem; }
        .form-input, .form-textarea { width:100%; padding:1rem 1.25rem; border:2px solid #e0e0e0; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:1rem; color:#1a1a2e; transition:all 0.3s ease; background:white; }
        .form-input:focus, .form-textarea:focus { outline:none; border-color:#ff6b35; box-shadow:0 0 0 4px rgba(255,107,53,0.1); }
        .form-textarea { resize:vertical; min-height:120px; line-height:1.6; }
        .price-input-group { position:relative; }
        .currency-symbol { position:absolute; left:1.25rem; top:50%; transform:translateY(-50%); color:#666; font-weight:600; pointer-events:none; }
        .form-input.with-currency { padding-left:2.5rem; }
        .photo-upload-area { border:2px dashed #d0d0d0; border-radius:16px; padding:3rem 2rem; text-align:center; background:#fafafa; transition:all 0.3s ease; cursor:pointer; }
        .photo-upload-area:hover { border-color:#ff6b35; background:#fff5f0; }
        .upload-icon { width:64px; height:64px; margin:0 auto 1rem; background:linear-gradient(135deg,#ff6b35 0%,#f7931e 100%); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; color:white; }
        .upload-text { color:#666; font-size:1rem; margin-bottom:0.5rem; }
        .upload-subtext { color:#999; font-size:0.875rem; }
        .photo-input { display:none; }
        .preview-area { display:none; margin-top:1.5rem; text-align:center; }
        .preview-area.active { display:block; }
        .preview-image { max-width:100%; max-height:300px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.15); margin-bottom:1rem; }
        .remove-photo-btn { background:#ff4444; color:white; border:none; border-radius:8px; padding:0.5rem 1.25rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:600; cursor:pointer; }
        .form-actions { display:flex; gap:1rem; margin-top:2.5rem; padding-top:2rem; border-top:1px solid #e0e0e0; }
        .success-message { display:none; background:linear-gradient(135deg,#4caf50 0%,#45a049 100%); color:white; padding:1.5rem; border-radius:16px; margin-bottom:2rem; text-align:center; }
        .success-message.show { display:block; }
        .success-message h3 { font-family:'Fraunces',serif; font-size:1.5rem; margin-bottom:1rem; }
        .success-actions { display:flex; gap:1rem; justify-content:center; }
        .success-btn { background:white; color:#4caf50; border:none; border-radius:10px; padding:0.75rem 1.5rem; font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:600; cursor:pointer; }
        .success-btn.secondary { background:transparent; color:white; border:2px solid white; }
        .submit-btn { flex:1; background:linear-gradient(135deg,#ff6b35 0%,#d84315 100%); border:none; border-radius:12px; padding:1.125rem 2rem; color:white; font-family:'DM Sans',sans-serif; font-size:1.125rem; font-weight:600; cursor:pointer; transition:all 0.3s ease; box-shadow:0 4px 15px rgba(216,67,21,0.4); }
        .submit-btn:hover { transform:translateY(-3px); box-shadow:0 8px 25px rgba(216,67,21,0.5); }
        .submit-btn:disabled { background:#ccc; cursor:not-allowed; transform:none; }
        .cancel-btn { background:transparent; border:2px solid #666; border-radius:12px; padding:1.125rem 2rem; font-family:'DM Sans',sans-serif; font-size:1.125rem; font-weight:600; color:#666; cursor:pointer; transition:all 0.3s ease; }
        .cancel-btn:hover { border-color:#ff6b35; color:#ff6b35; }
        .error-message { display:none; background:#fff5f5; border:2px solid #ff4444; border-radius:16px; padding:1rem 1.5rem; margin-bottom:2rem; color:#ff4444; font-weight:600; text-align:center; }
        .error-message.show { display:block; }
        /* Branch checklist */
        .branch-check-item { display:flex; align-items:center; gap:0.75rem; padding:0.85rem 1rem; border:1px solid #e8e8e8; border-radius:10px; cursor:pointer; background:#fafafa; }
        .branch-check-item:hover { border-color:#ff6b35; background:#fff8f5; }
        .branch-check-item input { accent-color:#ff6b35; width:18px; height:18px; cursor:pointer; }
        .swal2-container { z-index:20000 !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a id="backBtn" href="#" class="back-btn">← Back</a>
        <div class="header-text">
            <h1 class="page-title">Enter Menu Items</h1>
            <div class="branch-label" id="branchLabel"></div>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <h3>Item Added!</h3>
        <p>Your menu item has been successfully added.</p>
        <div class="success-actions">
            <button class="success-btn" id="addAnotherBtn">Add Another</button>
            <button class="success-btn secondary" id="returnDashboardBtn">Return to Dashboard</button>
        </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="form-card">
        <form id="itemForm">
            <div class="form-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" name="itemName" class="form-input" placeholder="e.g., Truffle Risotto" required minlength="2" maxlength="100"/>
            </div>
            <div class="form-group">
                <label for="itemPrice">Price</label>
                <div class="price-input-group">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="itemPrice" name="itemPrice" class="form-input with-currency" placeholder="0.00" step="0.01" min="0.01" max="9999.99" required/>
                </div>
            </div>
            <div class="form-group">
                <label for="itemDescription">Description</label>
                <textarea id="itemDescription" name="itemDescription" class="form-textarea" placeholder="Describe your dish..." required minlength="10" maxlength="500"></textarea>
            </div>
            <div class="form-group">
                <label for="category">Category <span class="optional">(Optional)</span></label>
                <input type="text" id="category" name="category" class="form-input" placeholder="e.g., Appetizers, Main Courses, Desserts" maxlength="100"/>
            </div>
            <div class="form-group">
                <label>Photo <span class="optional">(Optional)</span></label>
                <div class="photo-upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-subtext">PNG, JPG, WEBP up to 5MB</div>
                    <input type="file" id="itemPhoto" name="itemPhoto" class="photo-input" accept="image/png,image/jpeg,image/jpg,image/webp"/>
                </div>
                <div class="preview-area" id="previewArea">
                    <img id="previewImage" class="preview-image" src="" alt="Preview"/>
                    <div><button type="button" class="remove-photo-btn" id="removePhotoBtn">Remove Photo</button></div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
                <button type="submit" class="submit-btn" id="submitBtn">Add Item</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ── Setup ─────────────────────────────────────────────────────────────────
    const params     = new URLSearchParams(window.location.search);
    const branchId   = params.get('branchId');
    const branchName = params.get('branchName') || 'Branch';

    document.getElementById('backBtn').href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants';
    document.getElementById('branchLabel').textContent = branchId ? `Branch: ${branchName}` : '';
    document.getElementById('cancelBtn').onclick = () => { window.location.href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants'; };
    document.getElementById('returnDashboardBtn').onclick = () => { window.location.href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants'; };

    const API = branchId ? `/api/branch/${branchId}/items` : '/api/items';

    // ── Sibling branches ──────────────────────────────────────────────────────
    let siblingBranches = null;

    async function loadSiblingBranches() {
        if (!branchId || siblingBranches !== null) return siblingBranches || [];
        try {
            const res = await fetch(`/api/branch/${branchId}/sibling-branches`);
            siblingBranches = res.ok ? await res.json() : [];
        } catch(_) { siblingBranches = []; }
        return siblingBranches;
    }

    // ── Photo upload ──────────────────────────────────────────────────────────
    const uploadArea     = document.getElementById('uploadArea');
    const photoInput     = document.getElementById('itemPhoto');
    const previewArea    = document.getElementById('previewArea');
    const previewImage   = document.getElementById('previewImage');

    uploadArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', e => handleFiles(e.target.files));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#ff6b35'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
    uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

    document.getElementById('removePhotoBtn').addEventListener('click', () => {
        photoInput.value = ''; previewImage.src = '';
        previewArea.classList.remove('active'); uploadArea.style.display = 'block';
    });

    function handleFiles(files) {
        if (!files.length) return;
        const file = files[0];
        if (!['image/png','image/jpeg','image/jpg','image/webp'].includes(file.type)) { showError('Please upload a valid image file (PNG, JPG, WEBP)'); return; }
        if (file.size > 5 * 1024 * 1024) { showError('File size must be less than 5MB'); return; }
        const dt = new DataTransfer(); dt.items.add(file); photoInput.files = dt.files;
        const reader = new FileReader();
        reader.onload = e => { previewImage.src = e.target.result; previewArea.classList.add('active'); uploadArea.style.display = 'none'; };
        reader.readAsDataURL(file);
    }

    // ── Form submission ───────────────────────────────────────────────────────
    const itemForm       = document.getElementById('itemForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn      = document.getElementById('submitBtn');

    itemForm.addEventListener('submit', async e => {
        e.preventDefault();
        if (!itemForm.checkValidity()) { itemForm.reportValidity(); return; }

        submitBtn.disabled = true; submitBtn.textContent = 'Adding...';

        const formData = new FormData();
        formData.append('itemName',        document.getElementById('itemName').value.trim());
        formData.append('itemPrice',       document.getElementById('itemPrice').value);
        formData.append('itemDescription', document.getElementById('itemDescription').value.trim());
        formData.append('category',        document.getElementById('category').value.trim());
        if (photoInput.files.length > 0) formData.append('itemPhoto', photoInput.files[0]);

        try {
            const response = await fetch(API, { method:'POST', body: formData });
            const data = await response.json();

            if (response.ok && data.success) {
                // ✅ If main branch and siblings exist, offer to copy to other branches
                // ✅ use branchItemId — items are now stored in BranchMenuItem only
                if (data.isMainBranch && data.branchItemId) {
                    const siblings = await loadSiblingBranches();
                    if (siblings && siblings.length > 0) {
                        await offerCopyToBranches(data.branchItemId, siblings);
                    }
                }
                successMessage.classList.add('show');
                itemForm.style.display = 'none';
            } else {
                showError(data.error || 'Failed to add menu item.');
                submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
            }
        } catch (err) {
            showError('Network error. Please check your connection.');
            submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
        }
    });

    async function offerCopyToBranches(menuItemId, siblings) {
        return new Promise(resolve => {
            const checklistHtml = siblings.map(b =>
                `<div class="branch-check-item">
                    <input type="checkbox" id="bch-${b.id}" value="${b.id}" checked />
                    <label for="bch-${b.id}" style="cursor:pointer; font-weight:600; color:#1a1a2e;">${b.branchName}</label>
                </div>`).join('');

            Swal.fire({
                title: 'Copy to other branches?',
                html: `
                    <p style="color:#666; margin-bottom:1rem;">This item was added to the Main Branch. Select which other branches should also receive it:</p>
                    <div id="copyBranchChecklist" style="display:flex; flex-direction:column; gap:0.5rem; text-align:left;">
                        ${checklistHtml}
                    </div>`,
                showCancelButton: true,
                confirmButtonColor: '#ff6b35',
                cancelButtonText: 'Skip — branches stay independent',
                confirmButtonText: 'Copy to selected branches',
                target: document.body,
                preConfirm: () => {
                    return Array.from(document.querySelectorAll('#copyBranchChecklist input[type="checkbox"]:checked'))
                                .map(cb => parseInt(cb.value));
                }
            }).then(async result => {
                if (result.isConfirmed && result.value && result.value.length > 0) {
                    try {
                        await fetch(`${API}/${menuItemId}/copy-to-branches`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ branchIds: result.value })
                        });
                    } catch(_) {}
                }
                resolve();
            });
        });
    }

    document.getElementById('addAnotherBtn').addEventListener('click', () => {
        successMessage.classList.remove('show');
        itemForm.style.display = 'block';
        itemForm.reset();
        photoInput.value = ''; previewImage.src = '';
        previewArea.classList.remove('active'); uploadArea.style.display = 'block';
        submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
    });

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
    }
</script>
</body>
</html>
