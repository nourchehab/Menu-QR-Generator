<!DOCTYPE html>
<html>
<head>
    <title>Enter Items – FlavorFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#050505; --surface:#0d0d0d; --surface-2:#121212; --surface-3:#181818; --text:#f7efe8; --muted:#b8a79d; --faint:#8f7d73; --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.12); --orange:#ff7a1a; --orange-2:#ff9a4d; --orange-glow:0 0 0 1px rgba(255,122,26,.18),0 0 24px rgba(255,122,26,.22),0 10px 24px rgba(255,122,26,.18); }
        body { font-family:'Inter',sans-serif; background:radial-gradient(circle at top right, rgba(255,122,26,.10), transparent 20%), radial-gradient(circle at bottom left, rgba(255,122,26,.06), transparent 18%), var(--bg); min-height:100vh; padding:2rem; color:var(--text); }
        .container { max-width:840px; margin:0 auto; }
        .header { display:flex; align-items:center; gap:1.25rem; margin-bottom:2.2rem; }
        .back-btn { background:rgba(255,255,255,.03); border:1px solid var(--line-strong); border-radius:999px; padding:.7rem 1.15rem; color:var(--muted); font:600 .92rem 'Inter',sans-serif; text-decoration:none; display:inline-flex; align-items:center; gap:.5rem; transition:.22s ease; }
        .back-btn:hover { background:rgba(255,255,255,.05); color:var(--text); border-color:rgba(255,255,255,.18); }
        .page-title { font-family:'Sora',sans-serif; font-size:2.15rem; font-weight:700; color:var(--text); letter-spacing:-.04em; }
        .branch-label { font-size:.82rem; color:var(--orange-2); margin-top:.35rem; font-weight:700; }
        .form-card { background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 100%), var(--surface); border:1px solid var(--line); border-radius:26px; padding:2.4rem 2.6rem; box-shadow:0 22px 50px rgba(0,0,0,.36); }
        .form-group { margin-bottom:1.6rem; }
        .form-group label { display:block; font-weight:700; color:var(--text); margin-bottom:.6rem; font-size:.92rem; }
        .form-group .optional { font-weight:500; color:var(--faint); font-size:.82rem; margin-left:.4rem; }
        .form-input,.form-textarea { width:100%; padding:1rem 1.1rem; border:1px solid var(--line-strong); border-radius:14px; font-family:'Inter',sans-serif; font-size:.95rem; color:var(--text); background:var(--surface-2); transition:border-color .22s ease, box-shadow .22s ease, background .22s ease; }
        .form-input:focus,.form-textarea:focus { outline:none; border-color:rgba(255,122,26,.45); box-shadow:0 0 0 4px rgba(255,122,26,.10); background:var(--surface-3); }
        .form-input::placeholder,.form-textarea::placeholder { color:var(--faint); }
        .form-textarea { resize:vertical; min-height:110px; line-height:1.6; }
        .price-input-group { position:relative; }
        .currency-symbol { position:absolute; left:1.1rem; top:50%; transform:translateY(-50%); color:var(--faint); font-weight:700; pointer-events:none; }
        .form-input.with-currency { padding-left:2.25rem; }
        .photo-upload-area { border:1px dashed rgba(255,122,26,.22); border-radius:18px; padding:2.5rem 2rem; text-align:center; background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 100%), var(--surface-2); transition:.22s ease; cursor:pointer; }
        .photo-upload-area:hover { border-color:rgba(255,122,26,.38); background:linear-gradient(180deg, rgba(255,122,26,.05), transparent 100%), var(--surface-3); }
        .upload-icon { width:56px; height:56px; margin:0 auto 1rem; background:linear-gradient(135deg, var(--orange-2), var(--orange)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; box-shadow:var(--orange-glow); }
        .upload-text { color:var(--text); font-size:.96rem; margin-bottom:.4rem; font-weight:700; }
        .upload-subtext { color:var(--faint); font-size:.82rem; }
        .photo-input { display:none; }
        .preview-area { display:none; margin-top:1.5rem; text-align:center; } .preview-area.active { display:block; }
        .preview-image { max-width:100%; max-height:280px; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.28); margin-bottom:1rem; border:1px solid var(--line); }
        .remove-photo-btn { background:rgba(255,107,87,0.08); color:#ff8c7e; border:1px solid rgba(255,107,87,0.20); border-radius:999px; padding:.6rem 1.25rem; font:700 .875rem 'Inter',sans-serif; cursor:pointer; transition:.22s ease; }
        .remove-photo-btn:hover { background:rgba(255,107,87,.12); }
        .form-actions { display:flex; gap:1rem; margin-top:2rem; padding-top:1.75rem; border-top:1px solid var(--line); }
        .submit-btn { flex:1; background:linear-gradient(135deg, var(--orange-2), var(--orange)); border:none; border-radius:999px; padding:1rem 2rem; color:#fff; font:700 1rem 'Inter',sans-serif; cursor:pointer; transition:.22s ease; box-shadow:var(--orange-glow); }
        .submit-btn:hover { transform:translateY(-2px); }
        .submit-btn:disabled { background:rgba(255,255,255,.08); color:rgba(247,239,232,.45); cursor:not-allowed; transform:none; box-shadow:none; }
        .cancel-btn { background:rgba(255,255,255,.03); border:1px solid var(--line-strong); border-radius:999px; padding:1rem 1.75rem; font:700 1rem 'Inter',sans-serif; color:var(--muted); cursor:pointer; transition:.22s ease; }
        .cancel-btn:hover { background:rgba(255,255,255,.05); color:var(--text); border-color:rgba(255,255,255,.18); }
        .success-message { display:none; background:linear-gradient(180deg, rgba(255,122,26,.08), rgba(255,122,26,.02)), var(--surface); border:1px solid rgba(255,122,26,.20); border-radius:22px; padding:2rem; margin-bottom:2rem; text-align:center; box-shadow:0 12px 30px rgba(0,0,0,.20); } .success-message.show { display:block; }
        .success-message h3 { font-family:'Sora',sans-serif; font-size:1.4rem; font-weight:700; color:var(--text); margin-bottom:.5rem; }
        .success-message p { color:var(--muted); font-size:.92rem; margin-bottom:1.25rem; }
        .success-actions { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
        .success-btn { background:linear-gradient(135deg, var(--orange-2), var(--orange)); color:#fff; border:none; border-radius:999px; padding:.78rem 1.5rem; font:700 .92rem 'Inter',sans-serif; cursor:pointer; transition:.22s ease; box-shadow:var(--orange-glow); }
        .success-btn:hover { transform:translateY(-1px); }
        .success-btn.secondary { background:rgba(255,255,255,.03); border:1px solid var(--line-strong); color:var(--muted); box-shadow:none; }
        .success-btn.secondary:hover { background:rgba(255,255,255,.05); color:var(--text); border-color:rgba(255,255,255,.18); }
        .error-message { display:none; background:rgba(255,107,87,0.08); border:1px solid rgba(255,107,87,0.20); border-radius:14px; padding:1rem 1.25rem; margin-bottom:1.5rem; color:#ff8c7e; font-weight:700; font-size:.875rem; text-align:center; } .error-message.show { display:block; }
        .branch-check-item { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; border:1px solid var(--line); border-radius:12px; cursor:pointer; background:var(--surface-2); transition:.2s ease; }
        .branch-check-item:hover { border-color:rgba(255,122,26,.28); background:var(--surface-3); } .branch-check-item input { accent-color:var(--orange); width:18px; height:18px; cursor:pointer; }
        .swal2-container { z-index: 20000 !important; }
        @media (max-width: 640px) { .form-card { padding:1.5rem; } .form-actions { flex-direction:column; } .submit-btn,.cancel-btn { width:100%; } .page-title { font-size:1.7rem; } }

    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a id="backBtn" href="#" class="back-btn">← Back</a>
        <div class="header-text">
            <h1 class="page-title">Enter Menu Items</h1>
            <div class="branch-label" id="branchLabel"></div>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <h3>Item Added!</h3>
        <p>Your menu item has been successfully added.</p>
        <div class="success-actions">
            <button class="success-btn" id="addAnotherBtn">Add Another</button>
            <button class="success-btn secondary" id="returnDashboardBtn">Return to Dashboard</button>
        </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="form-card">
        <form id="itemForm">
            <div class="form-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" name="itemName" class="form-input" placeholder="e.g., Truffle Risotto" required minlength="2" maxlength="100"/>
            </div>
            <div class="form-group">
                <label for="itemPrice">Price</label>
                <div class="price-input-group">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="itemPrice" name="itemPrice" class="form-input with-currency" placeholder="0.00" step="0.01" min="0.01" max="9999.99" required/>
                </div>
            </div>
            <div class="form-group">
                <label for="itemDescription">Description</label>
                <textarea id="itemDescription" name="itemDescription" class="form-textarea" placeholder="Describe your dish..." required minlength="10" maxlength="500"></textarea>
            </div>
            <div class="form-group">
                <label for="category">Category <span class="optional">(Optional)</span></label>
                <input type="text" id="category" name="category" class="form-input" placeholder="e.g., Appetizers, Main Courses, Desserts" maxlength="100"/>
            </div>
            <div class="form-group">
                <label>Photo <span class="optional">(Optional)</span></label>
                <div class="photo-upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-subtext">PNG, JPG, WEBP up to 5MB</div>
                    <input type="file" id="itemPhoto" name="itemPhoto" class="photo-input" accept="image/png,image/jpeg,image/jpg,image/webp"/>
                </div>
                <div class="preview-area" id="previewArea">
                    <img id="previewImage" class="preview-image" src="" alt="Preview"/>
                    <div><button type="button" class="remove-photo-btn" id="removePhotoBtn">Remove Photo</button></div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
                <button type="submit" class="submit-btn" id="submitBtn">Add Item</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ── Setup ─────────────────────────────────────────────────────────────────
    const params     = new URLSearchParams(window.location.search);
    const branchId   = params.get('branchId');
    const branchName = params.get('branchName') || 'Branch';

    document.getElementById('backBtn').href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants';
    document.getElementById('branchLabel').textContent = branchId ? `Branch: ${branchName}` : '';
    document.getElementById('cancelBtn').onclick = () => { window.location.href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants'; };
    document.getElementById('returnDashboardBtn').onclick = () => { window.location.href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants'; };

    const API = branchId ? `/api/branch/${branchId}/items` : '/api/items';

    // ── Sibling branches ──────────────────────────────────────────────────────
    let siblingBranches = null;

    async function loadSiblingBranches() {
        if (!branchId || siblingBranches !== null) return siblingBranches || [];
        try {
            const res = await fetch(`/api/branch/${branchId}/sibling-branches`);
            siblingBranches = res.ok ? await res.json() : [];
        } catch(_) { siblingBranches = []; }
        return siblingBranches;
    }

    // ── Photo upload ──────────────────────────────────────────────────────────
    const uploadArea     = document.getElementById('uploadArea');
    const photoInput     = document.getElementById('itemPhoto');
    const previewArea    = document.getElementById('previewArea');
    const previewImage   = document.getElementById('previewImage');

    uploadArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', e => handleFiles(e.target.files));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#ff6b35'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
    uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

    document.getElementById('removePhotoBtn').addEventListener('click', () => {
        photoInput.value = ''; previewImage.src = '';
        previewArea.classList.remove('active'); uploadArea.style.display = 'block';
    });

    function handleFiles(files) {
        if (!files.length) return;
        const file = files[0];
        if (!['image/png','image/jpeg','image/jpg','image/webp'].includes(file.type)) { showError('Please upload a valid image file (PNG, JPG, WEBP)'); return; }
        if (file.size > 5 * 1024 * 1024) { showError('File size must be less than 5MB'); return; }
        const dt = new DataTransfer(); dt.items.add(file); photoInput.files = dt.files;
        const reader = new FileReader();
        reader.onload = e => { previewImage.src = e.target.result; previewArea.classList.add('active'); uploadArea.style.display = 'none'; };
        reader.readAsDataURL(file);
    }

    // ── Form submission ───────────────────────────────────────────────────────
    const itemForm       = document.getElementById('itemForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn      = document.getElementById('submitBtn');

    itemForm.addEventListener('submit', async e => {
        e.preventDefault();
        if (!itemForm.checkValidity()) { itemForm.reportValidity(); return; }

        submitBtn.disabled = true; submitBtn.textContent = 'Adding...';

        const formData = new FormData();
        formData.append('itemName',        document.getElementById('itemName').value.trim());
        formData.append('itemPrice',       document.getElementById('itemPrice').value);
        formData.append('itemDescription', document.getElementById('itemDescription').value.trim());
        formData.append('category',        document.getElementById('category').value.trim());
        if (photoInput.files.length > 0) formData.append('itemPhoto', photoInput.files[0]);

        try {
            const response = await fetch(API, { method:'POST', body: formData });
            const data = await response.json();

            if (response.ok && data.success) {
                if (data.isMainBranch && data.branchItemId) {
                    const siblings = await loadSiblingBranches();
                    if (siblings && siblings.length > 0) {
                        await offerCopyToBranches(data.branchItemId, siblings);
                    }
                }
                successMessage.classList.add('show');
                itemForm.style.display = 'none';
            } else {
                showError(data.error || 'Failed to add menu item.');
                submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
            }
        } catch (err) {
            showError('Network error. Please check your connection.');
            submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
        }
    });

    async function offerCopyToBranches(menuItemId, siblings) {
        return new Promise(resolve => {
            const checklistHtml = siblings.map(b =>
                `<div class="branch-check-item">
                    <input type="checkbox" id="bch-${b.id}" value="${b.id}" checked />
                    <label for="bch-${b.id}" style="cursor:pointer; font-weight:600; color:#1a1a2e;">${b.branchName}</label>
                </div>`).join('');

            Swal.fire({
                title: 'Copy to other branches?',
                html: `
                    <p style="color:#666; margin-bottom:1rem;">This item was added to the Main Branch. Select which other branches should also receive it:</p>
                    <div id="copyBranchChecklist" style="display:flex; flex-direction:column; gap:0.5rem; text-align:left;">
                        ${checklistHtml}
                    </div>`,
                showCancelButton: true,
                confirmButtonColor: '#ff6b35',
                cancelButtonText: 'Skip — branches stay independent',
                confirmButtonText: 'Copy to selected branches',
                target: document.body,
                preConfirm: () => {
                    return Array.from(document.querySelectorAll('#copyBranchChecklist input[type="checkbox"]:checked'))
                                .map(cb => parseInt(cb.value));
                }
            }).then(async result => {
                if (result.isConfirmed && result.value && result.value.length > 0) {
                    try {
                        await fetch(`${API}/${menuItemId}/copy-to-branches`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ branchIds: result.value })
                        });
                    } catch(_) {}
                }
                resolve();
            });
        });
    }

    document.getElementById('addAnotherBtn').addEventListener('click', () => {
        successMessage.classList.remove('show');
        itemForm.style.display = 'block';
        itemForm.reset();
        photoInput.value = ''; previewImage.src = '';
        previewArea.classList.remove('active'); uploadArea.style.display = 'block';
        submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
    });

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
    }
</script>
</body>
</html>
