<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/css/effects.css">
    <title>Login – FlavorFrame</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back!</h2>
        <p>Log in to manage your restaurant</p>

        <form method="post" action="/login" class="auth-form">

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <div class="remember-me">
            <label class="remember-me__label">
                <input type="checkbox" name="rememberMe" class="remember-me__checkbox">
                <span class="remember-me__text">Remember me</span>
            </label>
            </div>


            <button type="submit" class="btn btn-primary">Log In</button>
        </form>


        <span>Don’t have an account? <a href="/signup">Sign up</a></span>
    </div>
</div>

</body>
</html>
