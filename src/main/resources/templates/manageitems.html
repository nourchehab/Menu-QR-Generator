<!DOCTYPE html>
<html>
<head>
    <title>Manage Items – FlavorFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ff8c42 100%);
            min-height: 100vh; padding: 2rem; position: relative; overflow-x: hidden;
        }

        body::before {
            content: ''; position: absolute; top: -50%; right: -50%;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px; animation: drift 60s linear infinite; pointer-events: none;
        }

        @keyframes drift { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }

        .container { max-width: 1000px; margin: 0 auto; position: relative; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            /* Chat panel layout: fixed, larger, scrollable */
            #chatPanel { display:flex; flex-direction:column; height:60vh; max-height:70vh; min-height:360px; }
            .chat-messages { flex:1; overflow:auto; padding:1rem; display:flex; flex-direction:column; gap:0.6rem; align-items:flex-start; }

            /* User query box (left-aligned boxed bubble) */
            .chat-message.user { align-self:flex-start; max-width:86%; background:#111827; color:#f9fafb; padding:0.8rem 1rem; border-radius:10px; border:1px solid rgba(255,255,255,0.04); box-shadow:0 6px 18px rgba(2,6,23,0.6); font-weight:600; }

            /* Assistant response: centered block (not aligned to left or right) */
            .chat-message.assistant { align-self:center; max-width:86%; margin:0 auto; background:transparent; border:none; color:#0f1724; padding:0; font-weight:400; line-height:1.45; }
            .chat-message.assistant p { margin:0 0 .6rem 0; text-align:left; }

            /* Spacer inserted between a user message and the assistant reply (two-line gap) */
            .chat-spacer { height:2.2rem; }
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        @keyframes fadeSlideIn { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }

        .back-btn {
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px; padding: 0.75rem 1rem; color: white;
            font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.5rem; backdrop-filter: blur(10px);
            width: fit-content;
        }

        .back-btn:hover { background: rgba(255,255,255,0.25); transform: translateX(-3px); }

        .page-title { font-family: 'Fraunces', serif; font-size: 2.25rem; font-weight: 300; color: white; letter-spacing: -0.02em; }
        .branch-label { font-size: 0.85rem; color: rgba(255,255,255,0.75); font-weight: 500; }

        .add-btn {
            background: white; color: #ff6b35; text-decoration: none; border-radius: 12px;
            padding: 0.75rem 1.5rem; font-weight: 600; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); white-space: nowrap;
        }

        .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

        .content-card {
            background: rgba(255,255,255,0.98); border-radius: 24px; padding: 3rem;
            box-shadow: 0 30px 90px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
            animation: fadeSlideIn 0.8s ease-out 0.2s backwards;
        }

        .items-list { display: flex; flex-direction: column; gap: 1.5rem; }

        .item-card {
            display: flex; align-items: center; background: white;
            border: 1px solid #e0e0e0; border-radius: 16px; padding: 1.5rem; gap: 1.5rem;
            transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .item-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-color: #ffd0b8; }

        .item-image {
            width: 100px; height: 100px; border-radius: 12px; object-fit: cover;
            background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
            flex-shrink: 0;
        }

        .item-details { flex: 1; min-width: 0; }
        .item-name { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; color: #1a1a2e; margin-bottom: 0.25rem; }

        .item-price {
            font-weight: 600; color: #ff6b35; font-size: 1.1rem; margin-bottom: 0.5rem;
            display: inline-block; background: rgba(255,107,53,0.1); padding: 0.25rem 0.75rem; border-radius: 20px;
        }

        .item-category { margin-bottom: 0.5rem; color: #c47a1b; font-weight: 600; font-size: 0.9rem; }
        .item-desc { color: #666; font-size: 0.95rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .item-actions { display: flex; gap: 0.75rem; flex-shrink: 0; }

        .btn-action {
            padding: 0.5rem 1rem; border-radius: 8px; font-family: 'DM Sans', sans-serif;
            font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease;
            border: none; display: inline-flex; align-items: center; gap: 0.5rem;
        }

        .btn-edit { background: #f0f0f0; color: #1a1a2e; }
        .btn-edit:hover { background: #e0e0e0; transform: translateY(-2px); }
        .btn-delete { background: #fff0f0; color: #ff4444; }
        .btn-delete:hover { background: #ff4444; color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,68,68,0.3); }

        .empty-state { text-align: center; padding: 3rem 0; color: #666; display: none; }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
        .empty-state h3 { font-family: 'Fraunces', serif; color: #1a1a2e; font-size: 1.5rem; margin-bottom: 0.5rem; }

        .loader { text-align: center; padding: 2rem; color: #666; font-weight: 500; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,107,53,0.2); border-radius: 50%; border-top-color: #ff6b35; animation: spin 1s ease-in-out infinite; margin: 0 auto 1rem; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .form-input, .form-textarea {
            width: 100%; padding: 0.9rem 1rem; border: 2px solid #e0e0e0; border-radius: 12px;
            font-family: 'DM Sans', sans-serif; font-size: 1rem; color: #1a1a2e;
        }

        .form-input:focus, .form-textarea:focus { outline: none; border-color: #ff6b35; box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }

        .swal2-container { z-index: 20000 !important; }

        @media (max-width: 640px) {
            .content-card { padding: 1.5rem; }
            .item-card { flex-direction: column; align-items: flex-start; }
            .item-image { width: 100%; height: 200px; }
            .item-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
                <h1 class="page-title">Manage Items</h1>
            </div>
               <div style="display:flex; gap:0.75rem; align-items:center;">
                   <button id="categoriseAllBtn" class="add-btn btn-categorise" type="button">Categorise</button>
                   <a href="/enteritems" class="add-btn">+ Add Item</a>
               </div>
        </div>

    <div class="content-card">
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">🍽️</div>
            <h3>No items yet</h3>
            <p>You haven't added any menu items to this branch.</p>
            <a id="addItemEmptyBtn" href="#" class="add-btn"
               style="display:inline-block; margin-top:1.5rem; background:#ff6b35; color:white;">
                Start Adding Items
            </a>
        </div>

        <div class="items-list" id="itemsList">
            <div class="loader" id="loadingMsg">
                <div class="spinner"></div>
                <p>Loading your menu items...</p>
            </div>
        </div>
    </div>
</div>

    <!-- Edit Modal -->
    <div id="editModal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); align-items:center; justify-content:center; padding:1.5rem; z-index:9999;">
        <div
            style="width:100%; max-width:720px; background:#fff; border-radius:18px; padding:1.5rem; box-shadow:0 30px 90px rgba(0,0,0,0.35);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem;">
                <div style="font-family:'Fraunces', serif; font-size:1.35rem; color:#1a1a2e;">Edit Item</div>
                <button type="button" onclick="closeEditModal()" class="btn-action btn-edit"
                    style="padding:.45rem .75rem;">✕</button>
            </div>

        <form id="editForm">
            <input type="hidden" id="editItemId"/>

            <div style="margin-bottom:1rem;">
                <label style="display:block; font-weight:600; margin-bottom:.4rem;">Name</label>
                <input id="editItemName" class="form-input" required maxlength="100"/>
            </div>

            <div style="margin-bottom:1rem;">
                <label style="display:block; font-weight:600; margin-bottom:.4rem;">Price</label>
                <input id="editItemPrice" class="form-input" type="number" step="0.01" min="0" required/>
            </div>

            <div style="margin-bottom:1rem;">
                <label style="display:block; font-weight:600; margin-bottom:.4rem;">Description</label>
                <textarea id="editItemDescription" class="form-textarea" required maxlength="500" style="min-height:100px;"></textarea>
            </div>

            <div style="margin-bottom:1rem;">
                <label style="display:block; font-weight:600; margin-bottom:.4rem;">Category</label>
                <input id="editItemCategory" class="form-input" maxlength="100" placeholder="e.g. Starters, Mains, Desserts"/>
            </div>

                    <div style="display:flex; justify-content:flex-end; gap:.75rem; margin-top:1.25rem;">
                        <button type="button" class="btn-action btn-edit" onclick="closeEditModal()">Cancel</button>
                        <button id="saveEditBtn" type="submit" class="btn-action"
                            style="background:#ff6b35; color:white;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
    // ── Read branchId from URL ────────────────────────────────────────────────
    const params     = new URLSearchParams(window.location.search);
    const branchId   = params.get('branchId');
    const branchName = params.get('branchName') || 'Branch';

    if (!branchId) {
        // No branchId — shouldn't happen in the new flow; redirect home
        window.location.href = '/restaurants';
    }

    // Set navigation links
    const dashUrl = `/branch/${branchId}/dashboard`;
    const addUrl  = `/enteritems?branchId=${branchId}&branchName=${encodeURIComponent(branchName)}`;

    document.getElementById('backBtn').href       = dashUrl;
    document.getElementById('addItemBtn').href     = addUrl;
    document.getElementById('addItemEmptyBtn').href = addUrl;
    document.getElementById('branchLabel').textContent = `Branch: ${branchName}`;

    // ── API base ──────────────────────────────────────────────────────────────
    const API = `/api/branch/${branchId}/items`;

    // ── Fetch and render items ────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', fetchItems);

    async function fetchItems() {
        try {
            const response = await fetch(API);
            if (response.status === 401) { window.location.href = '/login'; return; }
            const items = await response.json();
            renderItems(items);
        } catch (err) {
            document.getElementById('itemsList').innerHTML =
                '<div class="loader"><p style="color:#ff4444">Error loading items. Please refresh.</p></div>';
        }
    }

    function renderItems(items) {
        const list  = document.getElementById('itemsList');
        const empty = document.getElementById('emptyState');
        list.innerHTML = '';

        if (!items || items.length === 0) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        items.forEach((item, index) => {
            const card  = document.createElement('div');
            card.className = 'item-card';
            card.style.animationDelay = `${index * 0.08}s`;

            // EffectiveMenuItem fields: name, price (BigDecimal as string/number), description, category
            // branchItemId is the ID to use for edit/delete
            const id       = item.branchItemId;
            const name     = item.name     || '';
            const price    = parseFloat(item.price || 0).toFixed(2);
            const desc     = item.description || '';
            const category = item.category || '';

            const safeName = name.replace(/'/g, "\\'");
            const safeDesc = desc.replace(/'/g, "\\'");
            const safeCat  = category.replace(/'/g, "\\'");

            card.innerHTML = `
                <img src="/images/menu-item-placeholder.svg" alt="${name}" class="item-image"
                     onerror="this.src='/images/menu-item-placeholder.svg';">
                <div class="item-details">
                    <div class="item-name">${name}</div>
                    <div class="item-price">$${price}</div>
                    <div class="item-category">${category || 'Uncategorized'}</div>
                    <div class="item-desc">${desc}</div>
                </div>
                <div class="item-actions">
                    <button class="btn-action btn-delete" onclick="deleteItem(${id})">Delete</button>
                    <button class="btn-action btn-edit"
                        onclick="openEditModal(${id}, '${safeName}', ${item.price}, '${safeDesc}', '${safeCat}')">
                        Edit
                    </button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    // ── Edit modal ────────────────────────────────────────────────────────────
    const editModal = document.getElementById('editModal');
    const editForm  = document.getElementById('editForm');

    window.openEditModal = function(id, name, price, description, category) {
        document.getElementById('editItemId').value          = id;
        document.getElementById('editItemName').value        = name;
        document.getElementById('editItemPrice').value       = price;
        document.getElementById('editItemDescription').value = description;
        document.getElementById('editItemCategory').value    = category || '';
        editModal.style.display = 'flex';
        setTimeout(() => document.getElementById('editItemName').focus(), 100);
    };

        window.closeEditModal = function () {
            editModal.style.display = 'none';
            editForm.reset();
        }

        editModal.addEventListener('click', function (e) {
            if (e.target === editModal) closeEditModal();
        });

        const editPhotoInput = document.getElementById('editItemPhoto');
        editPhotoInput.addEventListener('change', () => {
            const file = editPhotoInput.files && editPhotoInput.files[0];
            if (!file) return;

            const validTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp'];

            if (!validTypes.includes(file.type)) {
                Swal.fire({
                    title: 'Invalid file',
                    text: 'Please upload a PNG, JPG, or WEBP image.',
                    icon: 'error',
                    target: document.body
                });
                editPhotoInput.value = '';
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                Swal.fire({
                    title: 'File too large',
                    text: 'Image must be less than 5MB.',
                    icon: 'error',
                    target: document.body
                });
                editPhotoInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('newImagePreview').src = e.target.result;
                document.getElementById('newImagePreviewWrap').style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        window.deleteItemImage = async function () {
            const id = document.getElementById('editItemId').value;
            if (!id) return;

            const result = await Swal.fire({
                title: 'Delete this image?',
                text: "The item will keep its name/price/description.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff4444',
                cancelButtonColor: '#1a1a2e',
                confirmButtonText: 'Yes, delete image',
                allowOutsideClick: false,
                target: document.body
            });
            if (!result.isConfirmed) return;

            try {
                const response = await fetch('/api/items/' + id + '/image', { method: 'DELETE' });
                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('currentItemImage').src = '/images/menu-item-placeholder.svg';
                    document.getElementById('deleteImageBtn').style.display = 'none';

                    Swal.fire({
                        title: 'Deleted!',
                        text: 'Image removed.',
                        icon: 'success',
                        timer: 1200,
                        showConfirmButton: false,
                        target: document.body
                    });
                    fetchItems();
                } else {
                    Swal.fire({
                        title: 'Error!',
                        text: data.error || 'Failed to delete image',
                        icon: 'error',
                        target: document.body
                    });
                }
            } catch (err) {
                Swal.fire({
                    title: 'Error!',
                    text: 'A network error occurred',
                    icon: 'error',
                    target: document.body
                });
            }
        }

        // Categorise modal and functions
        const categoriseModal = document.createElement('div');
        categoriseModal.id = 'categoriseModal';
        categoriseModal.style.display = 'none';
        categoriseModal.style.position = 'fixed';
        categoriseModal.style.inset = '0';
        categoriseModal.style.background = 'rgba(0,0,0,0.55)';
        categoriseModal.style.alignItems = 'center';
        categoriseModal.style.justifyContent = 'center';
        categoriseModal.style.padding = '1.5rem';
        categoriseModal.style.zIndex = '9999';
        categoriseModal.innerHTML = `
            <div style="width:100%; max-width:760px; background:#fff; border-radius:18px; padding:1.25rem;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem;">
                    <div style="font-family:'Fraunces', serif; font-size:1.25rem; color:#1a1a2e;">Categorise Items</div>
                    <div style="display:flex; gap:.5rem; align-items:center;">
                        <button id="openAssistantBtn" type="button" class="btn-action btn-edit">Assistant</button>
                        <button type="button" id="closeCategoriseBtn" class="btn-action btn-edit">✕</button>
                    </div>
                </div>
                <div id="categoriseMain">
                    <div id="categoriseBody"><div class="loader"><div class="spinner"></div><div>Loading suggestions...</div></div></div>
                    <div style="display:flex; justify-content:flex-end; gap:.75rem; margin-top:1rem;">
                        <button id="applySuggestionBtn" class="btn-action" style="background:#ff6b35; color:white;">Apply Selected</button>
                    </div>
                </div>
                <div id="chatPanel" style="display:none; margin-top:1rem; border-top:1px solid #f0f0f0; padding-top:1rem;">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-controls" style="display:flex; gap:.5rem; align-items:center; margin-top:.5rem;">
                        <button id="chatBackBtn" class="btn-action btn-edit">Back</button>
                        <input id="chatInput" type="text" placeholder="Ask assistant about categories or suggestions..." style="flex:1; padding:.6rem .75rem; border:1px solid #e6e6e9; border-radius:8px;"/>
                        <button id="sendChatBtn" class="btn-action send" style="background:#1a73e8; color:white;">Send</button>
                    </div>
                </div>
            </div>`;
        document.body.appendChild(categoriseModal);

        // Wire header Categorise button (bulk) to open modal
        const headerCatBtn = document.getElementById('categoriseAllBtn');
        if (headerCatBtn) headerCatBtn.addEventListener('click', () => openCategoriseModal());

        let _categoriseState = { itemId: null, suggestions: [], selectedIndex: 0, chatHistory: [] };

        window.openCategoriseModal = async function (itemId) {
            _categoriseState.itemId = itemId;
            _categoriseState.suggestions = [];
            _categoriseState.selectedIndex = 0;
            document.getElementById('categoriseBody').innerHTML = '<div class="loader"><div class="spinner"></div><div>Loading suggestions...</div></div>';
            categoriseModal.style.display = 'flex';

            try {
                const resp = await fetch('/api/classify/suggest-schemas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                if (resp.status === 401 || resp.redirected) {
                    categoriseModal.style.display = 'none';
                    Swal.fire({ title: 'Sign in required', text: 'Please sign in to use categorisation.', icon: 'warning', confirmButtonText: 'Sign in', target: document.body })
                        .then(() => { window.location.href = '/login'; });
                    return;
                }
                if (!resp.ok) throw new Error('Server error ' + resp.status);
                const suggestions = await resp.json();
                _categoriseState.suggestions = suggestions;
                renderCategoriseSuggestions();
            } catch (err) {
                console.error('Categorise error', err);
                document.getElementById('categoriseBody').innerHTML = '<div style="color:#ff4444;">Failed to load suggestions.</div>';
            }
        }

        function renderCategoriseSuggestions() {
            const body = document.getElementById('categoriseBody');
            const suggestions = _categoriseState.suggestions || [];
            if (!suggestions.length) {
                body.innerHTML = '<div style="padding:1rem;">No suggestions available.</div>';
                return;
            }
            const html = suggestions.map((s, idx) => {
                const title = s.title || ('Suggestion ' + (idx+1));
                const groups = s.groups || {};
                const groupHtml = Object.keys(groups).slice(0,10).map(g => `<li><strong>${g}</strong>: ${(groups[g]||[]).slice(0,6).join(', ')}</li>`).join('');
                return `<div style="border:1px dashed #eee; padding:.75rem; margin-bottom:.5rem; border-radius:8px;">
                    <label style="display:flex; gap:1rem; align-items:center;"><input type="radio" name="suggestionSel" value="${idx}" ${idx===0? 'checked' : ''}/> <strong style="margin-left:.25rem;">${title}</strong> <span style="margin-left:8px; color:#888;">(${Math.round((s.confidence||0)*100)}%)</span></label>
                    <ul style="margin-top:.5rem; color:#444;">${groupHtml}</ul>
                </div>`;
            }).join('');
            body.innerHTML = html;
            document.querySelectorAll('input[name="suggestionSel"]').forEach(r => r.addEventListener('change', () => {
                _categoriseState.selectedIndex = parseInt(r.value);
            }));
        }

        // Chat assistant handlers inside modal
        function appendChatMessage(text, who) {
            const container = document.getElementById('chatMessages');
            if (!container) return;

            if (who === 'user') {
                const userBox = document.createElement('div');
                userBox.className = 'chat-message user';
                // put user query in a bold-ish box
                userBox.innerText = text;
                container.appendChild(userBox);
                container.scrollTop = container.scrollHeight;
                return;
            }

            // assistant reply: if the last element was a user message, insert a spacer of two lines
            const last = container.lastElementChild;
            if (last && last.classList && last.classList.contains('user')) {
                const spacer = document.createElement('div');
                spacer.className = 'chat-spacer';
                container.appendChild(spacer);
            }

            const bot = document.createElement('div');
            bot.className = 'chat-message assistant';
            // allow multi-paragraph assistant replies
            const paragraphs = (text || '').split('\n').filter(Boolean);
            paragraphs.forEach(p => {
                const pp = document.createElement('p');
                pp.innerText = p;
                bot.appendChild(pp);
            });
            container.appendChild(bot);
            container.scrollTop = container.scrollHeight;
        }

        document.addEventListener('click', async function (e) {
            if (e.target && e.target.id === 'openAssistantBtn') {
                document.getElementById('categoriseMain').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'block';

                // Auto-generate a greeting from the assistant when opened (only once)
                const container = document.getElementById('chatMessages');
                if (container && container.children.length === 0) {
                    // Reset history for a fresh session
                    _categoriseState.chatHistory = [];
                    const greetingMsg = 'Please provide a short, friendly greeting to an admin using the categorisation assistant.';
                    appendChatMessage('Thinking...', 'assistant');
                    try {
                        const resp = await fetch('/api/classify/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: greetingMsg,
                                history: _categoriseState.chatHistory
                            })
                        });

                        // Handle redirect to login (auth) explicitly
                        if (resp.redirected || resp.status === 302) {
                            const msg = 'Assistant: sign in required';
                            if (container.lastChild) container.lastChild.textContent = msg;
                            // skip pushing to history and exit handler
                            return;
                        }

                        let reply = null;
                        if (!resp.ok) {
                            // Try to extract text error for debugging
                            try { reply = await resp.text(); } catch (_) { reply = 'Assistant: error fetching greeting'; }
                        } else {
                            const ct = resp.headers.get('content-type') || '';
                            if (ct.includes('application/json')) {
                                try {
                                    const data = await resp.json();
                                    if (data) reply = data.reply || data.error || (typeof data === 'string' ? data : JSON.stringify(data));
                                } catch (e) {
                                    try { reply = await resp.text(); } catch (_) { reply = 'Assistant: error parsing response'; }
                                }
                            } else {
                                // Non-JSON success response
                                try { reply = await resp.text(); } catch (_) { reply = 'Assistant: (no reply)'; }
                            }
                        }

                        reply = reply || 'Hello — how can I help you with categorising your menu today?';
                        if (container.lastChild) container.lastChild.textContent = reply;
                        // Push greeting exchange to history so follow-ups have context
                        _categoriseState.chatHistory.push('User: ' + greetingMsg);
                        _categoriseState.chatHistory.push('Assistant: ' + reply);
                    } catch (err) {
                        if (container.lastChild) container.lastChild.textContent = 'Assistant: (network error)';
                    }
                }
            }
        });

        document.addEventListener('click', function (e) {
            if (e.target && e.target.id === 'chatBackBtn') {
                document.getElementById('chatPanel').style.display = 'none';
                document.getElementById('categoriseMain').style.display = 'block';
                // Clear messages & history so next open starts fresh
                const container = document.getElementById('chatMessages');
                if (container) container.innerHTML = '';
                _categoriseState.chatHistory = [];
            }
        });

        document.addEventListener('click', async function (e) {
            if (e.target && e.target.id === 'sendChatBtn') {
                const input = document.getElementById('chatInput');
                const msg = input && input.value && input.value.trim();
                if (!msg) return;
                appendChatMessage(msg, 'user');
                input.value = '';
                try {
                    const resp = await fetch('/api/classify/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: msg,
                            history: _categoriseState.chatHistory
                        })
                    });

                    if (resp.redirected || resp.status === 302) {
                        appendChatMessage('Assistant: sign in required', 'assistant');
                        return;
                    }

                    let reply = null;
                    if (!resp.ok) {
                        try { reply = await resp.text(); } catch (_) { reply = 'Assistant: error contacting server'; }
                        appendChatMessage(reply, 'assistant');
                        return;
                    }

                    const ct = resp.headers.get('content-type') || '';
                    if (ct.includes('application/json')) {
                        try {
                            const data = await resp.json();
                            reply = data.reply || data.error || (typeof data === 'string' ? data : JSON.stringify(data));
                        } catch (e) {
                            try { reply = await resp.text(); } catch (_) { reply = 'Assistant: error parsing response'; }
                        }
                    } else {
                        try { reply = await resp.text(); } catch (_) { reply = 'Assistant: no reply'; }
                    }

                    reply = reply || 'No reply';
                    appendChatMessage(reply, 'assistant');
                    // Update history so each new message has full prior context
                    _categoriseState.chatHistory.push('User: ' + msg);
                    _categoriseState.chatHistory.push('Assistant: ' + reply);
                    // Cap history at last 10 turns to keep prompt size manageable
                    if (_categoriseState.chatHistory.length > 20) {
                        _categoriseState.chatHistory = _categoriseState.chatHistory.slice(-20);
                    }
                } catch (err) { appendChatMessage('Assistant: network error', 'assistant'); }
            }
        });

        document.getElementById('closeCategoriseBtn').addEventListener('click', () => { categoriseModal.style.display = 'none'; });
        document.getElementById('applySuggestionBtn').addEventListener('click', async () => {
            const idx = _categoriseState.selectedIndex || 0;
            try {
                const resp = await fetch('/api/classify/apply-suggestion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ suggestionIndex: idx }) });
                if (resp.status === 401 || resp.redirected) {
                    categoriseModal.style.display = 'none';
                    Swal.fire({ title: 'Sign in required', text: 'Please sign in to apply suggestions.', icon: 'warning', confirmButtonText: 'Sign in', target: document.body })
                        .then(() => { window.location.href = '/login'; });
                    return;
                }
                const data = await resp.json();
                if (resp.ok && data.success) {
                    Swal.fire({ title: 'Applied', text: 'Suggestion applied to your items.', icon: 'success', timer: 1300, showConfirmButton: false, target: document.body });
                    categoriseModal.style.display = 'none';
                    fetchItems();
                } else {
                    Swal.fire({ title: 'Error', text: data.error || 'Failed to apply suggestion', icon: 'error', target: document.body });
                }
            } catch (err) {
                Swal.fire({ title: 'Error', text: 'Network error while applying suggestion', icon: 'error', target: document.body });
            }
        });

        editForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!editForm.checkValidity()) {
                editForm.reportValidity();
                return;
            }

        const saveBtn = document.getElementById('saveEditBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        const id = document.getElementById('editItemId').value;
        const formData = new FormData();
        formData.append('itemName',        document.getElementById('editItemName').value.trim());
        formData.append('itemPrice',       document.getElementById('editItemPrice').value);
        formData.append('itemDescription', document.getElementById('editItemDescription').value.trim());
        formData.append('category',        document.getElementById('editItemCategory').value.trim());

        try {
            const response = await fetch(`${API}/${id}`, { method: 'POST', body: formData });
            const data = await response.json();

            if (response.ok && (data.success === undefined || data.success)) {
                closeEditModal();
                Swal.fire({ title: 'Saved!', text: 'Item updated.', icon: 'success', timer: 1500, showConfirmButton: false, target: document.body });
                fetchItems();
            } else {
                Swal.fire({ title: 'Error!', text: data.error || 'Failed to update', icon: 'error', target: document.body });
            }
        } catch (err) {
            Swal.fire({ title: 'Error!', text: 'Network error', icon: 'error', target: document.body });
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
        }
    });

    // ── Delete ────────────────────────────────────────────────────────────────
    async function deleteItem(id) {
        const result = await Swal.fire({
            title: 'Delete this item?', text: "You won't be able to revert this!",
            icon: 'warning', showCancelButton: true,
            confirmButtonColor: '#ff4444', cancelButtonColor: '#1a1a2e',
            confirmButtonText: 'Yes, delete it', target: document.body
        });

        if (!result.isConfirmed) return;

        try {
            const response = await fetch(`${API}/${id}`, { method: 'DELETE' });
            const data = await response.json();

                if (response.ok && data.success) {
                    Swal.fire({
                        title: 'Deleted!',
                        text: 'Your item has been removed.',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false,
                        target: document.body
                    });
                    fetchItems();
                } else {
                    Swal.fire({
                        title: 'Error!',
                        text: data.error || 'Failed to delete item',
                        icon: 'error',
                        target: document.body
                    });
                }
            } catch (error) {
                Swal.fire({
                    title: 'Error!',
                    text: 'A network error occurred while deleting the item',
                    icon: 'error',
                    target: document.body
                });
            }
        }
    </script>

</body>
