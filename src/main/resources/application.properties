spring.application.name=backend-servicex

# Database Connection
spring.datasource.url=jdbc:postgresql://restaurant-admin-db.c3oec40wsyuk.eu-north-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=**Resto123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings (recommended)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# I faced issues with Hibernate metadata lookup delays
# Add a startup timeout so it doesn't hang forever
spring.datasource.hikari.initialization-fail-timeout=1

# Help Hibernate find the metadata faster
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Specific dialect for modern PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=INFO

spring.datasource.hikari.maxLifetime=300000
spring.datasource.hikari.keepaliveTime=60000
spring.datasource.hikari.validationTimeout=5000

