spring.application.name=backend-servicex

server.port=${PORT:8081}
server.address=0.0.0.0

# Base URL
# Local default is localhost. Railway/production should override APP_PUBLIC_BASE_URL.
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:http://localhost:${server.port}}

# HTTPS / proxy headers
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Session cookie
# Production: secure=true (set via SESSION_COOKIE_SECURE env var in Railway)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://restaurant-admin-db.c3oec40wsyuk.eu-north-1.rds.amazonaws.com:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=false

# Lazy initialization - load beans only when needed
spring.main.lazy-initialization=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.idle-timeout=300000

# Tomcat Threading
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# Logging - Keep errors only for production
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.jdbc.datasource=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Security
app.security.oauth2.enabled=${APP_SECURITY_OAUTH2_ENABLED:true}
app.e2e.bootstrap.enabled=${APP_E2E_BOOTSTRAP_ENABLED:false}

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}

# Brevo API
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:flavorframe06@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:FlavorFrame}

# ========================================
# LOAD TESTING DAY - MEMORY OPTIMIZATION
# ========================================
# Set these environment variables in Railway Variables tab:
# JAVA_OPTS = -Xms64m -Xmx300m -XX:+UseContainerSupport -XX:+UseSerialGC -XX:MaxMetaspaceSize=100m
# SESSION_COOKIE_SECURE = true (set above)
# ========================================
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.timeout.seconds=${BREVO_TIMEOUT_SECONDS:20}

# AWS S3 Credentials (use environment variables)
aws.access.key=${AWS_ACCESS_KEY_ID:}
aws.secret.key=${AWS_SECRET_ACCESS_KEY:}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.max-photo-size-bytes=5242880
file.upload.logo-dir=uploads/logos
file.upload.photo-dir=uploads/photos

# AI CONFIG — Groq
app.ai.apiKey=${GROQ_API_KEY:}
app.ai.endpoint=${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
app.ai.confidenceThreshold=${AI_CONFIDENCE_THRESHOLD:0.6}

# AWS S3 CONFIG
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:restautrant-photos-bucket}
aws.s3.region=${AWS_S3_REGION:eu-north-1}
aws.s3.photos-folder=photos/menu-items
aws.s3.logos-folder=photos/logos

# Migration
migration.enabled=false
migration.logos.enabled=false

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_CALLBACK_URL:${app.publicBaseUrl}/login/oauth2/code/{registrationId}}

# Enable Hibernate statistics and debug logging for diagnosing Metaspace / plan cache growth
# Temporary: enable on production only while troubleshooting, then remove or lower verbosity.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
spring.jpa.properties.hibernate.query.plan_cache_max_size=128

