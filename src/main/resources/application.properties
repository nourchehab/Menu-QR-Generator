# =========================
# FILE UPLOAD CONFIG (HARD LIMIT)
# =========================
# This blocks large uploads BEFORE your controller/service runs.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Menu item photo validation (used server-side in MenuItemImageStorageService)
