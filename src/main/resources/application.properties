spring.application.name=backend-servicex
server.port=${PORT:8081}
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:https://flavorframe.up.railway.app}
server.address=0.0.0.0
# HTTPS/Protocol Configuration for Railway
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://restaurant-admin-db.c3oec40wsyuk.eu-north-1.rds.amazonaws.com:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=1
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


# Brevo API (recommended on platforms where SMTP is blocked)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:flavorframe06@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:FlavorFrame}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.timeout.seconds=${BREVO_TIMEOUT_SECONDS:20}

# Logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Security
app.security.oauth2.enabled=${APP_SECURITY_OAUTH2_ENABLED:true}

# AI Service Configuration
# Python FastAPI AI service for menu categorization
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}


# AWS S3 Credentials (use environment variables)
aws.access.key=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# mvn
# spring.profiles.active=local
# (Removed to use PostgreSQL database instead of H2 local database)

# =========================
# FILE UPLOAD CONFIG
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.max-photo-size-bytes=5242880
file.upload.logo-dir=uploads/logos
file.upload.photo-dir=uploads/photos

# =========================
# AI CONFIG — Groq (free, no credit card required)
# Sign up at https://console.groq.com and set GROQ_API_KEY env variable.
# Key format: gsk_xxxxxxxxxxxxxxxxxxxx
# =========================
app.ai.apiKey=${GROQ_API_KEY:}
app.ai.endpoint=${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
app.ai.confidenceThreshold=${AI_CONFIDENCE_THRESHOLD:0.6}

# =========================
# AWS S3 CONFIG
# =========================
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:restautrant-photos-bucket}
aws.s3.region=${AWS_S3_REGION:eu-north-1}
aws.s3.photos-folder=photos/menu-items
aws.s3.logos-folder=photos/logos

# Migration
migration.enabled=false
migration.logos.enabled=false