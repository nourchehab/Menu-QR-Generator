# Custom upload directories
file.upload.logo-dir=uploads/logos
file.upload.photo-dir=uploads/photos

# AI provider API key (use env var AI_API_KEY in production)
app.ai.apiKey=${AI_API_KEY:}
# Default AI endpoint (use HF router). Override with env `AI_ENDPOINT` if needed.
# Use `router.huggingface.co` (replaces api-inference.huggingface.co)
app.ai.endpoint=${AI_ENDPOINT:https://router.huggingface.co/models/openai-community/gpt2}

