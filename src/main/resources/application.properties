spring.application.name=backend-servicex
server.port=8081
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:https://flavorframe.up.railway.app}
server.address=0.0.0.0

# Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://restaurant-admin-db.c3oec40wsyuk.eu-north-1.rds.amazonaws.com:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:**Resto123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=1
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:flavorframe6@gmail.com}
spring.mail.password=${MAIL_PASSWORD:owmn doli asba clup}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_CALLBACK_URL:https://FlavorFrame.railway.app/login/oauth2/code/google/login/oauth2/code/google}

# Logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# AI Service Configuration
# Python FastAPI AI service for menu categorization
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}


# AWS S3 Credentials (use environment variables)
