<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/effects.css">
  <title>Reset Password – FlavorFrame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">

  <style>
    .auth-card.slim {
      max-width: 460px;
    }

    .auth-card h2 {
      margin-bottom: 10px;
    }

    .auth-subtext {
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.6;
      text-align: center;
    }

    .step-indicator {
      margin-bottom: 22px;
    }

    .auth-form input {
      border-radius: 18px;
    }

    .page-link-btn {
      background: none;
      border: none;
      color: #ff9a4d;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      font-size: 0.92rem;
      text-decoration: none;
    }

    .page-link-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card slim">
    <div class="auth-brand">
      <img src="/images/FlavorFrame_LOGO.webp" alt="FlavorFrame logo" decoding="async">
    </div>

    <h2>Reset Password</h2>
    <p class="auth-subtext">Enter and confirm your new password below.</p>
    <div class="step-indicator">Step 2 of 2</div>

    <div class="auth-form">
      <input type="password" id="password" placeholder="New Password">
      <input type="password" id="confirm" placeholder="Retype Password">

      <button class="btn btn-primary" onclick="resetPassword()">Done</button>

      <div style="text-align:center; margin-top:18px;">
        <a href="/login" class="page-link-btn">← Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email = params.get("email");

function resetPassword() {
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (pass !== confirm) {
    alert("Passwords do not match");
    return;
  }

  fetch(`/auth/reset-password?email=${encodeURIComponent(email)}&newPassword=${encodeURIComponent(pass)}`, { method: "POST" })
    .then(res => {
        if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
        return res.text();
    })
    .then(msg => {
      alert(msg);
      window.location.href = "/login";
    })
    .catch(err => {
      alert(err.message);
    });
}
</script>

</body>
</html>
