<!DOCTYPE html>
<html>

<head>
  <title>Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f6f8;
    }

    .container {
      background: white;
      padding: 32px;
      width: 360px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-bottom: 24px;
    }

    input {
      width: 90%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    input:focus {
      outline: none;
      border-color: #ff9900;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ff9900;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #ff9900;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Reset Password</h2>

    <input type="password" id="password" placeholder="New Password">
    <input type="password" id="confirm" placeholder="Retype Password">

    <button onclick="resetPassword()">Done</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email");

    function resetPassword() {
      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (pass !== confirm) {
        alert("Passwords do not match");
        return;
      }

      fetch(`/auth/reset-password?email=${email}&newPassword=${pass}`, { method: "POST" })
        .then(res => {
          if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
          return res.text();
        })
        .then(msg => {
          alert(msg); // "Password reset successfully"
          window.location.href = "login.html";
        })
        .catch(err => {
          alert(err.message);
        });
    }
  </script>

</body>

</html>
