<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/effects.css">
  <title>Forgot Password – FlavorFrame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">

  <style>
    .auth-card.slim {
    max-width: 460px;
  }

  .auth-card h2 {
    margin-bottom: 10px;
  }

  .auth-subtext {
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.6;
    text-align: center;
  }

  .step-indicator {
    margin-bottom: 22px;
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-form input {
    border-radius: 18px;
  }

  .status-note {
    display: none;
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 12px;
    line-height: 1.5;
    text-align: center;
  }

  .otp-section {
    display: none;
  }

  .otp-section.active {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .page-link-btn {
    background: none;
    border: none;
    color: #ff9a4d;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    font-size: 0.92rem;
    text-decoration: none;
  }

  .page-link-btn:hover {
    color: #fff;
  }

  .otp-section.active {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }


  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card slim">
    <div class="auth-brand">
      <img src="/images/FlavorFrame_LOGO.webp" alt="FlavorFrame logo" decoding="async">
    </div>

    <h2>Forgot Password</h2>
    <p class="auth-subtext">Enter your email and we'll send you a 6-digit code.</p>
    <div class="step-indicator">Step 1 of 2</div>

    <div class="auth-form">
      <input type="email" id="email" placeholder="Enter your email" required>

      <button class="btn btn-primary" id="sendCodeBtn" onclick="sendCode()">Send Code</button>

      <p id="statusMsg" class="status-note">If the email exists, a code was sent.</p>

      <div id="otpSection" class="otp-section">
        <input type="text" id="otp" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric">
        <button class="btn btn-primary" onclick="verifyOtp()">Submit</button>
      </div>

      <div style="text-align:center; margin-top:18px;">
        <a href="/login" class="page-link-btn"> ← Back to Login </a>
      </div>
    </div>
  </div>
</div>

<script>
function sendCode() {
  const email = document.getElementById("email").value;
  if (!email) { alert("Please enter your email"); return; }

  fetch(`/auth/request-otp?email=${encodeURIComponent(email)}`, { method: "POST" })
    .then(res => {
      if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
      return res.text();
    })
    .then(() => {
      document.getElementById("sendCodeBtn").style.display = "none";
      document.getElementById("otpSection").classList.add("active");
      document.getElementById("statusMsg").style.display = "block";
    })
    .catch(err => { alert(err.message); });
}

function verifyOtp() {
  const email = document.getElementById("email").value;
  const otp = document.getElementById("otp").value;
  if (!/^\d{6}$/.test(otp)) { alert("OTP must be exactly 6 digits"); return; }

  fetch(`/auth/verify-otp?email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}`, { method: "POST" })
    .then(response => response.json())
    .then(isValid => {
      if (isValid === true) {
        window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
      } else {
        alert("Invalid or expired code");
      }
    })
    .catch(err => { console.error(err); alert("Something went wrong. Please try again."); });
}
</script>

</body>
</html>
