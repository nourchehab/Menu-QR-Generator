<!DOCTYPE html>
<html>
<head>
  <title>OTP Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f6f8;
    }

    .container {
      background: white;
      padding: 32px;
      width: 360px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h2 { margin-bottom: 24px; }

    input {
      width: 90%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    input:focus { outline: none; border-color: #ff9900; }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ff9900;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Forgot Password</h2>

  <input type="email" id="email" placeholder="Enter your email" required>

  <button id="sendCodeBtn" onclick="sendCode()">Send Code</button>
  <p id="statusMsg" style="display:none; color: #555; font-size: 13px; margin-top: 10px;">If email exists, code was sent</p>
  <div id="otpSection" style="display:none;">
    <input type="text" id="otp" placeholder="Enter 6-digit code">
    <button onclick="verifyOtp()">Submit</button>
  </div>
</div>

<script>
function sendCode() {
  const email = document.getElementById("email").value;
  if (!email) { alert("Please enter your email"); return; }

  fetch(`/auth/request-otp?email=${encodeURIComponent(email)}`, { method: "POST" })
    .then(res => {
      if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
      return res.text();
    })
    .then(() => {
      document.getElementById("sendCodeBtn").style.display = "none";
      document.getElementById("otpSection").style.display = "block";
      document.getElementById("statusMsg").style.display = "block";
    })
    .catch(err => { alert(err.message); });
}

function verifyOtp() {
  const email = document.getElementById("email").value;
  const otp = document.getElementById("otp").value;
  if (!/^\d{6}$/.test(otp)) { alert("OTP must be exactly 6 digits"); return; }

  fetch(`/auth/verify-otp?email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}`, { method: "POST" })
    .then(response => response.json())
    .then(isValid => {
      if (isValid === true) {
        window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
      } else {
        alert("Invalid or expired code");
      }
    })
    .catch(err => { console.error(err); alert("Something went wrong. Please try again."); });
}
</script>

</body>
</html>
