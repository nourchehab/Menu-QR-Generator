<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/css/effects.css">
    <title>Settings – FlavorFrame</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        .settings-card {
            max-width: 480px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }
        .field-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .form-divider {
            border: none;
            border-top: 1px solid var(--border, rgba(0,0,0,0.08));
            margin: 20px 0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--orange, #f97316); }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card settings-card">
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>

        <h2>Profile Settings</h2>
        <p>Update your restaurant details below</p>

        <form class="auth-form" style="margin-top: 24px;">
            <div class="field-group">
                <label for="restaurantName">Restaurant Name</label>
                <input type="text" id="restaurantName" placeholder="Your restaurant name">
            </div>

            <div class="field-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>

            <hr class="form-divider">

            <div class="field-group">
                <label for="newPassword">New Password <span style="font-weight:400; color: var(--text-muted);">(leave blank to keep current)</span></label>
                <input type="password" id="newPassword" placeholder="New password">
            </div>

            <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 8px;">
                Save Changes
            </button>
        </form>
    </div>
</div>

</body>
</html>
