<!DOCTYPE html>
<html>
<head>
    <title>Enter Items – FlavorFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8f5f1;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        .container { max-width: 800px; margin: 0 auto; position: relative; }

        .header {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .back-btn {
            background: transparent;
            border: 1.5px solid rgba(0, 0, 0, 0.15);
            border-radius: 999px;
            padding: 0.6rem 1.1rem;
            color: #1c1612;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .back-btn:hover {
            border-color: #f97316;
            color: #f97316;
            transform: translateX(-2px);
        }

        .header-text {}

        .page-title {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 300;
            color: #1c1612;
            letter-spacing: -0.02em;
        }

        .branch-label {
            font-size: 0.82rem;
            color: #7a6b60;
            margin-top: 0.2rem;
            font-weight: 500;
        }

        .form-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem 3rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }

        .form-group { margin-bottom: 1.75rem; }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1c1612;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }

        .form-group .optional {
            font-weight: 400;
            color: #7a6b60;
            font-size: 0.82rem;
            margin-left: 0.4rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.95rem 1.1rem;
            border: 1.5px solid rgba(0,0,0,0.09);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: #1c1612;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            background: #fff;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.10);
        }

        .form-textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

        .price-input-group { position: relative; }

        .currency-symbol {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #7a6b60;
            font-weight: 600;
            pointer-events: none;
        }

        .form-input.with-currency { padding-left: 2.25rem; }

        .photo-upload-area {
            border: 2px dashed rgba(0,0,0,0.12);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            background: #fafaf9;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .photo-upload-area:hover {
            border-color: #f97316;
            background: #fff8f5;
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            background: #f97316;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
        }

        .upload-text { color: #1c1612; font-size: 0.95rem; margin-bottom: 0.4rem; font-weight: 500; }
        .upload-subtext { color: #7a6b60; font-size: 0.82rem; }
        .photo-input { display: none; }

        .preview-area { display: none; margin-top: 1.5rem; text-align: center; }
        .preview-area.active { display: block; }

        .preview-image {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.10);
            margin-bottom: 1rem;
        }

        .remove-photo-btn {
            background: rgba(229, 57, 53, 0.08);
            color: #e53935;
            border: 1.5px solid rgba(229, 57, 53, 0.20);
            border-radius: 999px;
            padding: 0.5rem 1.25rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .remove-photo-btn:hover {
            background: #e53935;
            color: white;
            border-color: #e53935;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.75rem;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .submit-btn {
            flex: 1;
            background: #f97316;
            border: none;
            border-radius: 999px;
            padding: 1rem 2rem;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.28);
        }

        .submit-btn:hover {
            background: #e8640a;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.36);
        }

        .submit-btn:disabled {
            background: rgba(0,0,0,0.12);
            color: rgba(0,0,0,0.35);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .cancel-btn {
            background: transparent;
            border: 1.5px solid rgba(0,0,0,0.12);
            border-radius: 999px;
            padding: 1rem 1.75rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #7a6b60;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .cancel-btn:hover {
            border-color: #1c1612;
            color: #1c1612;
        }

        .success-message {
            display: none;
            background: #fff;
            border: 1.5px solid rgba(39, 174, 96, 0.30);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.10);
        }

        .success-message.show { display: block; }

        .success-message h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.4rem;
            font-weight: 400;
            color: #1c1612;
            margin-bottom: 0.5rem;
        }

        .success-message p {
            color: #7a6b60;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        .success-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }

        .success-btn {
            background: #f97316;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .success-btn:hover { background: #e8640a; transform: translateY(-1px); }

        .success-btn.secondary {
            background: transparent;
            border: 1.5px solid rgba(0,0,0,0.12);
            color: #7a6b60;
        }

        .success-btn.secondary:hover { border-color: #1c1612; color: #1c1612; background: transparent; }

        .error-message {
            display: none;
            background: #fff;
            border: 1.5px solid rgba(229, 57, 53, 0.25);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            color: #c0392b;
            font-weight: 600;
            font-size: 0.875rem;
            text-align: center;
        }

        .error-message.show { display: block; }

        .branch-check-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1.5px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            cursor: pointer;
            background: #fafaf9;
            transition: all 0.2s;
        }

        .branch-check-item:hover { border-color: #f97316; background: #fff8f5; }
        .branch-check-item input { accent-color: #f97316; width: 18px; height: 18px; cursor: pointer; }

        .swal2-container { z-index: 20000 !important; }

        @media (max-width: 640px) {
            .form-card { padding: 1.5rem; }
            .form-actions { flex-direction: column; }
            .submit-btn, .cancel-btn { width: 100%; }
            .page-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a id="backBtn" href="#" class="back-btn">← Back</a>
        <div class="header-text">
            <h1 class="page-title">Enter Menu Items</h1>
            <div class="branch-label" id="branchLabel"></div>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <h3>Item Added!</h3>
        <p>Your menu item has been successfully added.</p>
        <div class="success-actions">
            <button class="success-btn" id="addAnotherBtn">Add Another</button>
            <button class="success-btn secondary" id="returnDashboardBtn">Return to Dashboard</button>
        </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="form-card">
        <form id="itemForm">
            <div class="form-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" name="itemName" class="form-input" placeholder="e.g., Truffle Risotto" required minlength="2" maxlength="100"/>
            </div>
            <div class="form-group">
                <label for="itemPrice">Price</label>
                <div class="price-input-group">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="itemPrice" name="itemPrice" class="form-input with-currency" placeholder="0.00" step="0.01" min="0.01" max="9999.99" required/>
                </div>
            </div>
            <div class="form-group">
                <label for="itemDescription">Description</label>
                <textarea id="itemDescription" name="itemDescription" class="form-textarea" placeholder="Describe your dish..." required minlength="10" maxlength="500"></textarea>
            </div>
            <div class="form-group">
                <label for="category">Category <span class="optional">(Optional)</span></label>
                <input type="text" id="category" name="category" class="form-input" placeholder="e.g., Appetizers, Main Courses, Desserts" maxlength="100"/>
            </div>
            <div class="form-group">
                <label>Photo <span class="optional">(Optional)</span></label>
                <div class="photo-upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-subtext">PNG, JPG, WEBP up to 5MB</div>
                    <input type="file" id="itemPhoto" name="itemPhoto" class="photo-input" accept="image/png,image/jpeg,image/jpg,image/webp"/>
                </div>
                <div class="preview-area" id="previewArea">
                    <img id="previewImage" class="preview-image" src="" alt="Preview"/>
                    <div><button type="button" class="remove-photo-btn" id="removePhotoBtn">Remove Photo</button></div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
                <button type="submit" class="submit-btn" id="submitBtn">Add Item</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ── Setup ─────────────────────────────────────────────────────────────────
    const params     = new URLSearchParams(window.location.search);
    const branchId   = params.get('branchId');
    const branchName = params.get('branchName') || 'Branch';

    document.getElementById('backBtn').href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants';
    document.getElementById('branchLabel').textContent = branchId ? `Branch: ${branchName}` : '';
    document.getElementById('cancelBtn').onclick = () => { window.location.href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants'; };
    document.getElementById('returnDashboardBtn').onclick = () => { window.location.href = branchId ? `/branch/${branchId}/dashboard` : '/restaurants'; };

    const API = branchId ? `/api/branch/${branchId}/items` : '/api/items';

    // ── Sibling branches ──────────────────────────────────────────────────────
    let siblingBranches = null;

    async function loadSiblingBranches() {
        if (!branchId || siblingBranches !== null) return siblingBranches || [];
        try {
            const res = await fetch(`/api/branch/${branchId}/sibling-branches`);
            siblingBranches = res.ok ? await res.json() : [];
        } catch(_) { siblingBranches = []; }
        return siblingBranches;
    }

    // ── Photo upload ──────────────────────────────────────────────────────────
    const uploadArea     = document.getElementById('uploadArea');
    const photoInput     = document.getElementById('itemPhoto');
    const previewArea    = document.getElementById('previewArea');
    const previewImage   = document.getElementById('previewImage');

    uploadArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', e => handleFiles(e.target.files));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#ff6b35'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
    uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

    document.getElementById('removePhotoBtn').addEventListener('click', () => {
        photoInput.value = ''; previewImage.src = '';
        previewArea.classList.remove('active'); uploadArea.style.display = 'block';
    });

    function handleFiles(files) {
        if (!files.length) return;
        const file = files[0];
        if (!['image/png','image/jpeg','image/jpg','image/webp'].includes(file.type)) { showError('Please upload a valid image file (PNG, JPG, WEBP)'); return; }
        if (file.size > 5 * 1024 * 1024) { showError('File size must be less than 5MB'); return; }
        const dt = new DataTransfer(); dt.items.add(file); photoInput.files = dt.files;
        const reader = new FileReader();
        reader.onload = e => { previewImage.src = e.target.result; previewArea.classList.add('active'); uploadArea.style.display = 'none'; };
        reader.readAsDataURL(file);
    }

    // ── Form submission ───────────────────────────────────────────────────────
    const itemForm       = document.getElementById('itemForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn      = document.getElementById('submitBtn');

    itemForm.addEventListener('submit', async e => {
        e.preventDefault();
        if (!itemForm.checkValidity()) { itemForm.reportValidity(); return; }

        submitBtn.disabled = true; submitBtn.textContent = 'Adding...';

        const formData = new FormData();
        formData.append('itemName',        document.getElementById('itemName').value.trim());
        formData.append('itemPrice',       document.getElementById('itemPrice').value);
        formData.append('itemDescription', document.getElementById('itemDescription').value.trim());
        formData.append('category',        document.getElementById('category').value.trim());
        if (photoInput.files.length > 0) formData.append('itemPhoto', photoInput.files[0]);

        try {
            const response = await fetch(API, { method:'POST', body: formData });
            const data = await response.json();

            if (response.ok && data.success) {
                if (data.isMainBranch && data.branchItemId) {
                    const siblings = await loadSiblingBranches();
                    if (siblings && siblings.length > 0) {
                        await offerCopyToBranches(data.branchItemId, siblings);
                    }
                }
                successMessage.classList.add('show');
                itemForm.style.display = 'none';
            } else {
                showError(data.error || 'Failed to add menu item.');
                submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
            }
        } catch (err) {
            showError('Network error. Please check your connection.');
            submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
        }
    });

    async function offerCopyToBranches(menuItemId, siblings) {
        return new Promise(resolve => {
            const checklistHtml = siblings.map(b =>
                `<div class="branch-check-item">
                    <input type="checkbox" id="bch-${b.id}" value="${b.id}" checked />
                    <label for="bch-${b.id}" style="cursor:pointer; font-weight:600; color:#1a1a2e;">${b.branchName}</label>
                </div>`).join('');

            Swal.fire({
                title: 'Copy to other branches?',
                html: `
                    <p style="color:#666; margin-bottom:1rem;">This item was added to the Main Branch. Select which other branches should also receive it:</p>
                    <div id="copyBranchChecklist" style="display:flex; flex-direction:column; gap:0.5rem; text-align:left;">
                        ${checklistHtml}
                    </div>`,
                showCancelButton: true,
                confirmButtonColor: '#ff6b35',
                cancelButtonText: 'Skip — branches stay independent',
                confirmButtonText: 'Copy to selected branches',
                target: document.body,
                preConfirm: () => {
                    return Array.from(document.querySelectorAll('#copyBranchChecklist input[type="checkbox"]:checked'))
                                .map(cb => parseInt(cb.value));
                }
            }).then(async result => {
                if (result.isConfirmed && result.value && result.value.length > 0) {
                    try {
                        await fetch(`${API}/${menuItemId}/copy-to-branches`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ branchIds: result.value })
                        });
                    } catch(_) {}
                }
                resolve();
            });
        });
    }

    document.getElementById('addAnotherBtn').addEventListener('click', () => {
        successMessage.classList.remove('show');
        itemForm.style.display = 'block';
        itemForm.reset();
        photoInput.value = ''; previewImage.src = '';
        previewArea.classList.remove('active'); uploadArea.style.display = 'block';
        submitBtn.disabled = false; submitBtn.textContent = 'Add Item';
    });

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
    }
</script>
</body>
</html>
