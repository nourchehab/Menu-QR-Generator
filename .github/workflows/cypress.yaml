name: Cypress Tests

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Cypress dependencies
        run: npm ci

      - name: Run Cypress and record to Cloud
        uses: cypress-io/github-action@v6
        with:
          install: false
          record: true
          browser: chrome
          start: ./mvnw -B -ntp spring-boot:run
          wait-on: "http://localhost:8081/login"
          wait-on-timeout: 180
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}